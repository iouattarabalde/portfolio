name: Bump asset cache-busters

# Whenever a shared asset changes, auto-syncs its ?v=N cache-buster across every
# page that links it, so this manual step can't be forgotten. The page list is
# discovered by scripts/bump_asset_versions.py rather than written here: it was a
# literal list until Sept 2026, and admin/index.html had silently drifted 13
# versions behind after being left out of it.
#
# site.js and i18n.js joined style.css here in Sept 2026. They had been
# unversioned, like the HTML that loads them, so mid-deploy a visitor could hold
# a new page against a cached older site.js and call a function that didn't exist
# in it yet. One shared version number covers all three assets — see the script
# for why that's a single counter and not one per file.
on:
  push:
    branches: [main]
    paths:
      - 'style.css'
      - 'site.js'
      - 'i18n.js'

permissions:
  contents: write

# Serializes runs of this workflow so two quick pushes to a shared asset can't
# both bump-and-push at once and collide. Not cancel-in-progress: every run must
# actually finish, since skipping one would leave that change unbumped.
concurrency:
  group: auto-commit-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python3 scripts/bump_asset_versions.py

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -u stages every tracked file the script actually rewrote. It used to
          # be a literal list of three pages, which is how admin/index.html came to
          # drift 13 versions behind before Aug 2026, and privacy/ and terms/ would
          # have repeated it in Sept 2026. The script discovers its own file list now.
          git add -u
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "Auto-bump asset cache-busters [skip ci]"
            # Rebase-then-push, retried: the sibling workflow (generate-share-pages)
            # commits to main too, and a push from a job that started before its commit
            # landed is rejected non-fast-forward. The concurrency group above already
            # serializes THIS workflow against itself and against that one, so this is
            # the belt to that braces — it also covers a human pushing mid-run.
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push rejected, rebasing and retrying ($attempt/3)..."
              git pull --rebase origin main
            done
            echo "Could not push after 3 attempts." >&2
            exit 1
          fi
