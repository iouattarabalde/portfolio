name: Generate share pages and sitemap

# Regenerates project/<slug>.html + assets/og/<slug>.jpg (OG share cards) and
# sitemap.xml from data/projects.json whenever a project is added/edited
# (admin saves) or a cover thumbnail changes. assets/og/** is excluded from
# the trigger paths so the commit this workflow makes doesn't re-trigger itself.
on:
  push:
    branches: [main]
    paths:
      - 'data/projects.json'
      - 'assets/**'
      - '!assets/og/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate projects.json integrity
        run: python3 scripts/validate_projects.py

      - run: pip install pillow

      - run: python3 scripts/generate_share_pages.py

      - run: python3 scripts/generate_sitemap.py

      - name: Commit regenerated share pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/og project sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-regenerate share pages + sitemap [skip ci]"
            git push
          fi
