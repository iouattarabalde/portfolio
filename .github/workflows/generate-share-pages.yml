name: Generate share pages and sitemap

# Regenerates project/<slug>.html + assets/og/<slug>.jpg (OG share cards) and
# sitemap.xml from data/projects.json whenever a project is added/edited
# (admin saves) or a cover thumbnail changes. assets/og/** is excluded from
# the trigger paths so the commit this workflow makes doesn't re-trigger itself.
on:
  push:
    branches: [main]
    paths:
      - 'data/projects.json'
      - 'assets/**'
      - '!assets/og/**'

permissions:
  contents: write

# Shares one concurrency group with bump-css-version.yml: both workflows commit
# and push to main, and a single push touching style.css *and* assets/ used to
# start both at once, leaving one to fail non-fast-forward. Serializing them
# means the second starts from a checkout that already contains the first's
# commit. Not cancel-in-progress: a skipped run would leave share pages stale.
concurrency:
  group: auto-commit-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate projects.json integrity
        run: python3 scripts/validate_projects.py

      - run: pip install pillow

      - run: python3 scripts/generate_share_pages.py

      - run: python3 scripts/generate_sitemap.py

      - name: Commit regenerated share pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/og project sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-regenerate share pages + sitemap [skip ci]"
            # Rebase-then-push, retried — see the matching block in
            # bump-css-version.yml for the full reasoning. The concurrency group
            # above should already prevent the collision; this also covers a
            # human pushing to main mid-run.
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push rejected, rebasing and retrying ($attempt/3)..."
              git pull --rebase origin main
            done
            echo "Could not push after 3 attempts." >&2
            exit 1
          fi
