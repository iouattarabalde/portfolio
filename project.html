<!DOCTYPE html>
<!--
  project.html — single dynamic template for every project (no more per-project HTML files).
  Reads the project id from the URL query string (?project=slug), looks it up in
  data/projects.json, and renders its gallery + credits. Visited as e.g.
  project.html?project=fleur-de-peau, linked from the work grid on index.html.
-->
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Les deux langues cohabitent dans le DOM ([data-fr] / [data-en], masquées par CSS), alors
     la traduction automatique de Chrome retraduit les deux copies et donne n'importe quoi.
     Ces trois signaux (meta google, translate="no" et .notranslate sur <html>) désactivent
     la barre "Traduire cette page" : le toggle FR/EN du site reste la seule bascule. -->
<meta name="google" content="notranslate">
<title id="page-title">Project — Ismael OB</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<!-- Generic sharing card: crawlers don't run JS, so per-project OG tags aren't possible
     on a static host — every project link shares the same site-wide card as index.html. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Ismael OB — Colorist">
<meta property="og:description" content="Color grading for commercials, music videos, film and television. Based in Montreal, available remote.">
<meta property="og:image" content="https://ismaelob.com/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- The two faces used above the fold, fetched alongside the stylesheet rather than once it has
     been parsed. Self-hosted since Sept 2026; see "Typefaces" in style.css. -->
<link rel="preload" href="fonts/big-shoulders-display-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fragment-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=138">
<!-- The JSON this page renders from, fetched while the HTML is still parsing rather than
     once the scripts at the bottom of <body> get round to it (Sept 2026). crossorigin is
     what makes the preload's request match fetch()'s default same-origin credentials
     mode; without it the browser would download each file twice. -->
<link rel="preload" href="data/projects.json?v=138" as="fetch" crossorigin>
<link rel="preload" href="data/strings.json?v=138" as="fetch" crossorigin>
<!-- Shared behaviours for every page: the cycling accent colour (self-starting, own
     randomised phase offset per load — so navigating between pages can land at a
     different point in the loop each time), plus esc(), withViewTransition(),
     and initLangToggle() used below. See site.js. -->
<script src="site.js?v=138"></script>
<script src="i18n.js?v=138"></script>
<!-- Prerenders the next project page from the link to it (Sept 2026). In Chrome and Edge,
     hovering the next-project card for a moment (or starting to tap it) loads that page
     invisibly, so the click shows it at once instead of waiting on its data and stills.
     Other browsers ignore this block. Every project is the same template with a different
     ?project=, so one rule on the pathname covers them all. The gallery's entrance waits for
     the page to actually be shown; see whenActivated() in site.js. -->
<script type="speculationrules">
{
  "prerender": [
    { "where": { "href_matches": { "pathname": "/project.html" } }, "eagerness": "moderate" }
  ]
}
</script>
</head>
<body>

<div class="grain-overlay" aria-hidden="true"></div>

<nav class="site-nav">
  <div class="brand">
    <a href="index.html" class="wordmark">ISMAEL<span>OB</span></a>
    <span class="nav-eyebrow"><span data-fr data-key="nav.eyebrow"></span><span data-en data-key="nav.eyebrow"></span></span>
  </div>
  <div class="nav-links">
    <a href="index.html#work" data-back-to-grid><span data-fr data-key="nav.work"></span><span data-en data-key="nav.work"></span></a>
    <a href="index.html#contact"><span data-fr data-key="nav.contact"></span><span data-en data-key="nav.contact"></span></a>
    <button id="lang-toggle" type="button" aria-label="Toggle language">FR</button>
  </div>
</nav>

<!-- Filled by JS below once the project is found in projects.json -->
<section class="project-gallery" id="project-gallery"></section>

<!-- Hidden until the project is found and rendered (display:none avoids a flash of empty content) -->
<section class="project-info" id="project-info" style="display:none;">
  <div class="bottom-glow" aria-hidden="true">
    <div class="bottom-glow-gradient"></div>
  </div>
  <div class="project-info-main">
    <a class="project-back" href="index.html#work" data-back-to-grid>← <span data-fr data-key="project.back"></span><span data-en data-key="project.back"></span></a>
    <h1 class="project-title" id="project-title" data-reveal></h1>
    <dl class="credits" data-reveal>
      <div>
        <dt><span data-fr data-key="project.type_label"></span><span data-en data-key="project.type_label"></span></dt>
        <dd id="project-type">—</dd>
      </div>
      <div id="project-client-wrap" style="display:none;">
        <dt><span data-fr data-key="project.client_label"></span><span data-en data-key="project.client_label"></span></dt>
        <dd id="project-client">—</dd>
      </div>
      <div id="project-artist-wrap" style="display:none;">
        <dt><span data-fr data-key="project.artist_label"></span><span data-en data-key="project.artist_label"></span></dt>
        <dd id="project-artist">—</dd>
      </div>
      <div>
        <dt><span data-fr data-key="project.director_label"></span><span data-en data-key="project.director_label"></span></dt>
        <dd id="project-director">—</dd>
      </div>
      <div>
        <dt><span data-fr data-key="project.dp_label"></span><span data-en data-key="project.dp_label"></span></dt>
        <dd id="project-dp">—</dd>
      </div>
    </dl>
  </div>

  <!-- Jump straight to the next project without going back through the grid — requested
       Aug 2026. "Next" means the following entry in projects.json's own order (same
       order the admin's drag-and-drop reordering controls, same order the homepage grid
       renders in before any type filter is applied — there's no filter state to inherit
       here), wrapping back to the first project after the last one. Hidden entirely by
       JS if there's only one project total, since a link back to itself isn't useful.
       Populated + shown by JS below alongside the rest of project-info. -->
  <a class="next-project" id="next-project" href="#" style="display:none;" data-reveal>
    <p class="next-project-label"><span data-fr data-key="project.next_label"></span><span data-en data-key="project.next_label"></span> →</p>
    <img class="next-project-thumb" id="next-project-thumb" alt="" loading="lazy">
    <p class="next-project-title" id="next-project-title"></p>
  </a>
</section>

<!-- Shown instead of project-info if the ?project= id doesn't match anything in projects.json -->
<section class="project-info" id="project-not-found" style="display:none;">
  <p class="eyebrow"><span data-fr data-key="project.not_found_eyebrow"></span><span data-en data-key="project.not_found_eyebrow"></span></p>
  <h1 class="project-title">
    <span data-fr data-key="project.not_found_heading"></span>
    <span data-en data-key="project.not_found_heading"></span>
  </h1>
  <a class="project-back" href="index.html#work" data-back-to-grid>← <span data-fr data-key="project.back"></span><span data-en data-key="project.back"></span></a>
</section>

<!-- Full-screen image viewer, opened by clicking any gallery thumbnail (see wireLightbox below).
     Prev/next live inside .lightbox-content (not as siblings) so that on mobile they can be
     pulled into a row directly under the palette strip instead of floating near the bottom
     of the viewport — see .lightbox-nav-row in style.css, Aug 2026. On desktop they're still
     positioned absolute against .lightbox itself (unaffected by this nesting, since
     .lightbox-content has no position of its own and therefore isn't a containing block). -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" id="lightbox-close" type="button">✕ <span data-fr data-key="lightbox.close"></span><span data-en data-key="lightbox.close"></span></button>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-palette" id="lightbox-palette" aria-hidden="true"></div>
    <div class="lightbox-nav-row">
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous image">←</button>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next image">→</button>
    </div>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // project.html script overview:
  //   1. Language toggle (same pattern as index.html)
  //   2. Lightbox (click a still to enlarge; close via ✕, Escape, or clicking the backdrop)
  //   3. Load i18n.js (all static copy + type acronyms) and the requested project from
  //      data/projects.json in parallel, then render both
  // ---------------------------------------------------------------

  const body = document.body;
  // Toggle itself lives in site.js; the callback re-runs the one thing on this page
  // built in JS that would otherwise keep its old-language label.
  initLangToggle(() => renderProjectType());
  // The links carrying data-back-to-grid return to the grid through history when they can
  // (site.js), so the homepage comes back exactly as it was left.
  initBackToGrid();

  // Lightbox: wireLightbox() attaches click handlers to gallery thumbnails, opening each
  // at its own index. It's called again after the gallery is (re)rendered from JSON,
  // since those <button> elements don't exist yet when this script first runs.
  // Navigation (arrows + keyboard) loops: past the last image wraps to the first and
  // vice versa, via the (i + length) % length trick in openLightboxAt.
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxPalette = document.getElementById('lightbox-palette');
  const lightboxPrev = document.getElementById('lightbox-prev');
  const lightboxNext = document.getElementById('lightbox-next');
  const lightboxCloseBtn = document.getElementById('lightbox-close');
  let lightboxIndex = -1;
  let lightboxTrigger = null; // element to return focus to on close — set only on the initial open, not on prev/next navigation

  // Keeps the palette strip exactly as wide as the image actually renders at — measured
  // directly in JS rather than relied on via a CSS percentage-height chain (the lightbox
  // wrapper's height is content-driven, not a definite value, which is exactly the kind
  // of ambiguous case that behaves inconsistently across browsers without live testing
  // to verify it). Runs on every image load, not just the first, since different stills
  // can have different aspect ratios and therefore different rendered widths.
  // Called from the image's load event AND synchronously from applyImage() whenever the
  // file is already decoded — which is the usual case on open, since the tile the
  // lightbox grows out of carries the very same src. With only the load handler (as it
  // was until Sept 2026) the swatches started their entrance at the *previous* still's
  // width and the whole strip snapped a frame or two later, landing right in the middle
  // of the stagger. Same reasoning as sizeReel()'s synchronous first call in index.html.
  // The completeness check matters: without a decoded frame there are no intrinsic
  // dimensions yet, so offsetWidth would measure a collapsed box.
  // The strip is exactly as wide as the photograph it describes — a palette that ran
  // wider than its own still read as chrome rather than as part of the image.
  //
  // That is not the same as the image box's width any more. The box is pinned per gallery
  // (see measureGalleryRatios below), so in a gallery that mixes formats an off-ratio
  // still is letterboxed inside it and offsetWidth is the frame, not the picture. What
  // object-fit: contain actually paints is the smaller of the box and the still's own
  // ratio against the box's height, which is what this computes. In a single-ratio
  // gallery the two are identical, so this is the width the strip has always had.
  //
  // The width therefore changes on every arrow press in a mixed gallery; style.css
  // animates it rather than letting it jump. See .lightbox-palette there.
  // ratio, when given, is the still's own aspect ratio from projects.json — exact, and
  // known before the file has decoded. That matters for more than precision: waiting on
  // the decode (which is all this could do before the dimensions were stored) meant the
  // width change started on the load event, whole frames after the image crossfade it is
  // supposed to move with, so the strip visibly trailed the picture. The box itself is
  // sized by CSS from the gallery's bounds, not from the image, so it can be measured
  // immediately and only the ratio was ever missing.
  //
  // Falls back to the decoded file for the load listener below, and for an entry with no
  // stored dimensions.
  function sizePalette(ratio) {
    const r = ratio || (lightboxImg.naturalWidth && lightboxImg.naturalHeight
      ? lightboxImg.naturalWidth / lightboxImg.naturalHeight
      : 0);
    if (!r) return;
    const photoWidth = Math.min(lightboxImg.offsetWidth, lightboxImg.offsetHeight * r);
    lightboxPalette.style.width = Math.round(photoWidth) + 'px';
  }

  // The gallery's ratio bounds, which is what the pinned frame is sized from
  // (see .lightbox-content img in style.css). Read off the tiles rather than stored in
  // projects.json — gallery tiles are eager, not lazy, so by the time anything can be
  // opened they have all decoded, and a variant carries the same ratio as its original.
  // `current` folds in the still being opened, so a tile that somehow hasn't decoded
  // can't leave its own image overflowing the frame.
  function measureGalleryRatios(current) {
    let lo = Infinity;
    let hi = 0;
    // Preferred source: the true dimensions stored per entry in projects.json (w/h),
    // stamped at upload time. Exact, available before a single pixel is decoded, and the
    // only way the frame can hug its image to the pixel — see the note on the variant
    // rounding below for why measuring the tiles cannot.
    const stored = (currentProject && currentProject.gallery) || [];
    let capW = 0;
    stored.forEach((item) => {
      if (!item.w || !item.h) return;
      const r = item.w / item.h;
      if (r < lo) lo = r;
      if (r > hi) hi = r;
      if (item.w > capW) capW = item.w;
    });
    // The widest still in the gallery: past this the frame would be scaling every file in
    // it beyond its own pixels. Only meaningful on a display wide enough to reach it.
    if (capW) lightbox.style.setProperty('--lb-cap-w', capW + 'px');
    else lightbox.style.removeProperty('--lb-cap-w');
    // Fallback for entries written before w/h existed: read the tiles. Gallery tiles are
    // eager, not lazy, so by the time anything can be opened they have all decoded.
    if (!hi) {
      document.querySelectorAll('.gallery-item img').forEach((img) => {
        if (!img.naturalWidth || !img.naturalHeight) return;
        const r = img.naturalWidth / img.naturalHeight;
        if (r < lo) lo = r;
        if (r > hi) hi = r;
      });
    }
    // Only fold the on-screen still into the bounds when they came from the tiles: its
    // ratio is read off a variant too, so against exact stored dimensions it would do
    // nothing but widen the frame by the variant's own rounding error.
    if (current && !stored.some((item) => item.w && item.h)) {
      lo = Math.min(lo, current);
      hi = Math.max(hi, current);
    }
    // The ratios above come off resized variants, so a gallery that is really one shape
    // still reports a spread: rounding a 1920x1080 still to 640 wide lands on 640x358 or
    // 640x359, which is 1.78 give or take half a percent. Left alone that makes the frame
    // a few pixels wider or taller than the photo in every existing single-ratio project
    // — invisible, but it is a frame that no longer hugs its image, and the palette strip
    // inherits the error. Anything inside 2% is treated as one shape and collapsed to the
    // mean. Real ratio families are much further apart than that (1.78 vs 1.85 is 4%), so
    // this can't merge two shapes that genuinely differ.
    //
    // It leaves a residual offset of up to ~0.5% (about 4px at this size) because the mean
    // of the variants still isn't the original's exact ratio. Removing that last bit needs
    // the true dimensions, i.e. storing w/h per entry in projects.json at upload time —
    // the admin already decodes every still to compress it, so they're free to capture.
    if (hi && isFinite(lo) && hi / lo < 1.02) { lo = hi = (lo + hi) / 2; }
    if (!hi || !isFinite(lo)) { // nothing decoded: leave the per-image fallback in charge
      lightbox.style.removeProperty('--lb-r-min');
      lightbox.style.removeProperty('--lb-r-max');
      return;
    }
    lightbox.style.setProperty('--lb-r-min', String(lo));
    lightbox.style.setProperty('--lb-r-max', String(hi));
  }
  lightboxImg.addEventListener('load', sizePalette);

  // Replays the entrance wave when a navigation changed the still's FORMAT, which is the
  // only time the strip's width moves. See .lightbox-palette.is-reshaping in style.css
  // for why a format change is staged as an arrival rather than a resize.
  //
  // Defined out here, not inside openLightboxAt: that function runs on every arrow press,
  // and the listener below would accumulate one copy per press if it were declared there.
  function reshapePalette(changed, backwards) {
    // Cleared first so a second format change can replay it. Removing and re-adding in
    // one frame is otherwise a no-op — the animation name never changed, so the browser
    // sees nothing to restart. The forced reflow between the two is what makes it take.
    lightboxPalette.classList.remove('is-reshaping');
    if (!changed) return;
    const swatches = lightboxPalette.children;
    const last = swatches.length - 1;
    for (let i = 0; i <= last; i++) {
      swatches[i].style.setProperty('--wave', String(backwards ? last - i : i));
    }
    void lightboxPalette.offsetWidth;
    lightboxPalette.classList.add('is-reshaping');
  }
  // Dropped when the wave is over, not when its first swatch finishes — that would cut
  // the rest of it short. The swatch with the highest --wave is the one to wait for: every
  // swatch runs the same duration, so the one that starts last ends last. Asking instead
  // whether any animation is still running would depend on exactly when the browser
  // detaches a finished one, which is not something to rely on.
  lightboxPalette.addEventListener('animationend', (e) => {
    if (e.animationName !== 'palette-enter') return;
    const last = String(lightboxPalette.children.length - 1);
    if (e.target.style.getPropertyValue('--wave') === last) {
      lightboxPalette.classList.remove('is-reshaping');
    }
  });

  // Full-resolution stills fetched this visit, keyed by URL, and the subset already
  // decoded. Kept for the life of the page so a still seen once, or preloaded as the
  // neighbour of the one on screen, opens straight on its full file next time instead of
  // on a grid variant. A failed or stalled download is dropped from the map so the next
  // request for it tries again rather than handing back the same broken Image.
  const fullStills = new Map();
  const paintableStills = new Set();
  function preloadFull(url) {
    if (fullStills.has(url)) return fullStills.get(url);
    const img = new Image();
    img.src = url;
    fullStills.set(url, img);
    whenPaintable(img, () => {
      if (img.naturalWidth) paintableStills.add(url);
      else fullStills.delete(url);
    });
    return img;
  }

  // Quietly replaces the grid variant the lightbox opened with by the full-resolution
  // file, once that file is decoded and can be swapped in without a blank frame —
  // whenPaintable() (site.js) is what waits for the decode rather than just the bytes.
  // Both guards matter: arrowing on to another still, or closing, before the download
  // lands must not drop a stale photo into the frame.
  function upgradeToFull(url, forIndex) {
    if (lightboxImg.src.endsWith(url)) return; // already the full file
    const preload = preloadFull(url);
    whenPaintable(preload, () => {
      if (lightboxIndex !== forIndex || !lightbox.classList.contains('open')) return;
      if (!preload.naturalWidth) return; // failed to load; keep the variant on screen
      lightboxImg.src = url;
    });
  }

  // The gallery tile showing whichever still is currently open — the shape the lightbox
  // grows out of and collapses back into, and where focus returns to on close. Resolved
  // by index every time rather than held as the element that was originally clicked:
  // the arrows change which still is on screen, so the clicked tile stops being the one
  // the image belongs to as soon as anyone navigates, and both the morph and the focus
  // hand-off would end up pointing at an unrelated photo.
  function currentThumb() {
    return document.querySelectorAll('.gallery-item')[lightboxIndex] || null;
  }

  // Clears the shared view-transition-name off every tile. Belt and braces rather than
  // clearing the one tile we know about: a name left behind anywhere means two rendered
  // elements claiming it, which costs the transition entirely (silently — the DOM update
  // still lands, so it just stops animating). The close below already gives its own name
  // back, but that cleanup rides on a callback, and a callback that doesn't run — an
  // interrupted transition, a script error mid-close — strands the name on that tile for
  // the rest of the session. Sweeping before each open makes it self-correcting.
  //
  // It also used to cover a deploy: site.js was unversioned, so a visitor could briefly
  // hold a new project.html against a cached older copy whose withViewTransition took no
  // second argument and never ran the callback. site.js carries a ?v=N of its own since
  // Sept 2026, so the page and the script it loads can no longer come apart that way.
  function releaseThumbNames() {
    document.querySelectorAll('.gallery-item img').forEach((im) => {
      im.style.viewTransitionName = '';
    });
  }

  // Crossfades between stills when navigating an already-open lightbox, requested Aug
  // 2026. Uses the same-document View Transitions API rather than a manual opacity
  // animation: the browser snapshots the current image, runs the DOM update, snapshots
  // the new image, and crossfades between them natively. #lightbox-img has its own
  // view-transition-name (see style.css) so only the image itself crossfades, not the
  // whole page. Falls back to an instant swap in browsers without support, handled
  // inside withViewTransition(); no separate fallback animation to maintain.
  //
  // The initial open used to skip this on the grounds that there was nothing to
  // crossfade FROM — but there is, and it's the tile that was just clicked. It even
  // carries the same src as the enlarged still (see the gallery markup below), so the
  // full-resolution file is already decoded and the morph costs no extra network work.
  // Handing the shared view-transition-name from the tile to #lightbox-img *inside* the
  // update callback is what makes this legal: the name has to be unique among rendered
  // elements at each snapshot, and the two qualify at different moments — the lightbox
  // is display:none (so not rendered, so not holding the name) when the old snapshot is
  // taken, and the tile has already given it up by the time the new one is.
  // options.instant skips the crossfade when stepping between stills: the swipe gesture
  // below animates the change itself, as a slide.
  function openLightboxAt(index, options) {
    if (!currentProject) return;
    const gallery = currentProject.gallery;
    const previousIndex = lightboxIndex;
    lightboxIndex = (index + gallery.length) % gallery.length; // loops both directions
    const item = gallery[lightboxIndex]; // {filename, palette} — see data/projects.json, Aug 2026
    const hasMultiple = gallery.length > 1;
    const isNavigating = lightbox.classList.contains('open');

    // The palette does two quite different things depending on whether the lightbox is
    // already open.
    //
    // Opening: build the swatches and let them rise from the strip's baseline on a
    // stagger (.is-entering — see style.css). --i carries each swatch's place in the
    // wave, replacing a hand-written nth-child ladder whose 12-step cap made the last
    // two swatches of every 13-colour palette start together and stalled the wave one
    // step short of the end.
    //
    // Navigating: write the new colours onto the swatches already on screen and leave
    // the entrance off entirely. Rebuilding them (which this did until Sept 2026)
    // replayed the full ~750ms wave on top of the browser's ~250ms image crossfade —
    // two motions on two unrelated clocks, so the palette never settled while arrowing
    // through a gallery. .lightbox-palette has no view-transition-name of its own, so it
    // rides the root snapshot and the colour change crossfades in step with the image.
    function applyPalette(colors) {
      const swatches = lightboxPalette.children;
      // Every palette is 13 swatches, so this is the path prev/next actually takes. The
      // rebuild below covers opening, and any project whose palette length differs.
      if (isNavigating && swatches.length === colors.length) {
        lightboxPalette.classList.remove('is-entering');
        colors.forEach((hex, i) => { swatches[i].style.background = hex; });
        return;
      }
      lightboxPalette.innerHTML = colors
        .map((hex, i) => `<div style="--i:${i};background:${esc(hex)}"></div>`)
        .join('');
      lightboxPalette.classList.toggle('is-entering', !isNavigating);
      if (!isNavigating) lightboxPalette.classList.remove('is-reshaping');
    }

    // Opens on whatever the grid already decoded for this tile, then upgrades to the
    // full-resolution file underneath.
    //
    // Before the gallery served responsive variants, the tile and the lightbox shared one
    // src, so the enlarged still was always already in cache and the morph out of the tile
    // cost nothing. That stopped being true the moment the grid started picking a 640 or
    // 1280 variant: opening would have grown the tile into an empty frame and waited on a
    // fresh ~420KB download. currentSrc is the exact file the browser chose for that tile,
    // so it is decoded and paints instantly.
    //
    // A variant only paints at the right size because the box is sized from the still's
    // aspect ratio (--lb-img-ratio, see .lightbox-content img in style.css), not from the

    // decoded file, which every variant shares with the original.
    //

    // below), it goes straight in instead, and its own width becomes the cap so a still
    // narrower than 1920px isn't stretched past its pixels. Otherwise the cap stays at
    // --lb-max-natural and isn't revised when the upgrade lands, since that would bring
    // the jump back.
    function applyImage() {
      const openingThumb = currentThumb();
      const openingThumbImg = openingThumb && openingThumb.querySelector('img');
      const fullSrc = `assets/${item.filename}`;
      const full = paintableStills.has(fullSrc) ? fullStills.get(fullSrc) : null;
      const variant = openingThumbImg && openingThumbImg.naturalWidth ? openingThumbImg : null;

      const widthBefore = isNavigating ? Math.round(lightboxPalette.getBoundingClientRect().width) : 0;

        // first -> last as -1 (backward), not as a jump the length of the gallery.

      upgradeToFull(fullSrc, lightboxIndex);
      // The stills either side, so the next arrow press opens on the full file.
      if (hasMultiple) {

    if (isNavigating) {
      if (options && options.instant) applyImage();

      return;
    }

    const thumb = currentThumb();
    const thumbImg = thumb && thumb.querySelector('img');
    if (!thumbImg) { // gallery not rendered yet, or an index with no tile — open plainly

      return;
    }
    releaseThumbNames();
    thumbImg.style.viewTransitionName = 'lightbox-img';
    withViewTransition(() => {

  }

  lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); openLightboxAt(lightboxIndex + 1); });

    if (e.key === 'ArrowRight') { openLightboxAt(lightboxIndex + 1); return; }

        first.focus();
      }

  // rather than a pair of buttons.
  //
  // Until then a swipe was read only once the finger lifted: nothing moved during the drag,
  // then the still crossfaded. Now the still (with its palette strip) follows the finger
  // from the first few pixels, and what happens on release depends on how far it went and
  // how fast:
  //   - Sideways past the threshold, or flicked: the still slides out that way and the next
  //     one slides in from the other side. Short of that it springs back.
  //   - Downward: the still follows the finger and shrinks a little as the backdrop and the
  //     close button fade. Past ~110px, or flicked down, the lightbox closes, and because the
  //     still is left exactly where the finger let go, the existing close morph shrinks it
  //     from there back into its tile. Short of that it springs back.
  // Upward drags get a little rubber-band resistance and always spring back. A gallery of a
  // single still rubber-bands sideways too, since there is nowhere to go.
  //
  // Pointer events rather than touch events, filtered to touch and pen: a mouse keeps the
  // arrows, the keyboard and the backdrop click. The direction is decided once, after 8px of
  // movement, so a slightly diagonal swipe can't turn into a dismissal half-way through.
  // touch-action: none on .lightbox (style.css) is what keeps the browser from claiming the
  // same gesture for a page scroll or a zoom and cancelling it.
  //
  // How far a sideways drag has to travel before it counts: 12% of the lightbox's width,
  // capped at 80px and floored at 30px. Was a flat 50px until Sept 2026, tuned once on a
  // phone: that's 13% of a 390px portrait screen but under 5% of a tablet, where the same
  // gesture became so easy to trigger that resting a thumb and shifting slightly would skip
  // an image. 12% reproduces the phone feel (390px gives 47px); the cap is there because
  // thumb reach doesn't grow with the screen.
  function swipeThreshold() {
    const width = lightbox.clientWidth || window.innerWidth;
    return Math.max(30, Math.min(width * 0.12, 80));
  }
  const DISMISS_DISTANCE = 110;   // px of downward drag that closes on release
  const FLICK_SPEED = 0.35;       // px/ms, measured over the last ~80ms of the drag
  const SWIPE_OUT_MS = 140;       // ms the thrown still takes to leave
  const SWIPE_IN_MS = 320;        // ms the next one takes to settle in
  // A still that was thrown rather than dragged across leaves with a little blur -- the one
  // place on the site where movement itself is blurred (everywhere else blur means depth:
  // the nav and the lightbox chrome blur what passes behind them). Two things gate it, so
  // it only ever appears on a gesture that really is fast:
  //   - the release has to count as a flick, so a deliberate page-turn dragged past the
  //     distance threshold stays perfectly sharp;
  //   - the radius follows how fast the still will actually be travelling as it leaves, not
  //     how fast the finger was going. A flick released after 20px has most of the slide
  //     still to cover and smears; one released 100px in has almost nowhere left to go, and
  //     blurring something that is barely moving would just look like a soft image.
  // Capped at 3px: filter re-rasterizes the layer every frame and the cost grows with radius
  // x blurred area, which here is a viewport-wide still.
  const BLUR_MAX = 3;             // px of blur at BLUR_FULL_RATE and above
  const BLUR_FULL_RATE = 1.5;     // px/ms of outgoing travel that earns the full radius
  const BLUR_MIN = 0.4;           // below this it isn't visible, so don't pay for the filter
  function motionBlur(rate) {

  const lightboxContent = lightbox.querySelector('.lightbox-content');

  let dragFrame = 0;
  let gestureAnimation = null;

    lightboxContent.style.scale = '';

  function paintDrag() {
    dragFrame = 0;

    const frames = blur

      const inBlur = blur ? +(blur / 2).toFixed(2) : 0;

        ? [{ translate: `${step * travel}px 0px`, opacity: 0, filter: `blur(${inBlur}px)` },

        : [{ translate: `${step * travel}px 0px`, opacity: 0 }, { translate: '0px 0px', opacity: 1 }];

  const params = new URLSearchParams(window.location.search);
  const projectId = params.get('project');
  let currentProject = null; // cached after fetch so renderProjectType() can re-run on language toggle

  function renderProjectType() {
    if (!currentProject) return;

    document.getElementById('project-type').textContent = projectTypeAcronym(currentProject.type, isFr) || '—';
  }

  // i18n and the project data are independent fetches, loaded in parallel — applyStrings()

  Promise.all([

    .then(([, data]) => {

      if (!project) {
        document.getElementById('project-not-found').style.display = '';

      }
      currentProject = project;

      document.getElementById('page-title').textContent = project.title + ' — Ismael OB';
      document.getElementById('project-title').textContent = project.title;
      renderProjectType();
      if (project.client) {
        document.getElementById('project-client').textContent = project.client;
        document.getElementById('project-client-wrap').style.display = '';
      }
      if (project.artist) {
        document.getElementById('project-artist').textContent = project.artist;
        document.getElementById('project-artist-wrap').style.display = '';
      }
      document.getElementById('project-director').textContent = project.director || '—';
      document.getElementById('project-dp').textContent = project.dp || '—';

      // Jump-to-next-project card — "next" is the following entry in projects.json's
      // own order, wrapping back to the first project after the last one. Hidden
      // entirely if there's only one project total (a link back to itself isn't useful).
      if (data.projects.length > 1) {
        const currentIndex = data.projects.findIndex((p) => p.id === projectId);
        const nextProject = data.projects[(currentIndex + 1) % data.projects.length];
        const nextLink = document.getElementById('next-project');
        const nextThumb = document.getElementById('next-project-thumb');

      // Builds the srcset for a still from the variants scripts/generate_image_variants.py

  // the 1920w entry. The widths here have to match VARIANT_WIDTHS in that script.
  //

  // viewport rather than its full width. gallerySizesAttr() below works out which
  // fraction. On a 1440px display that's a 476px slot, which picks the 1280 variant on a
  // 2x screen and the 640 on a 1x one, instead of the 1920px original the page used to
  // serve at every size. For the heaviest project that is the difference between 10MB

  // gets a working image.
  function srcsetFor(filename) {

      `assets/${stem}-1280${ext} 1280w`,
      `assets/${filename} 1920w`

  // reveal wave and the sizes attribute below need that number. Restating it here would
  // mean a breakpoint change in the CSS silently desyncing two things that can't see it.
  //
  // Safe to call on an empty grid: explicit tracks exist whether or not there are items
  // in them, so this resolves before the stills are injected. #project-gallery is never
  // display:none (unlike #project-info), so it always has computed tracks to read.
  function galleryColumnCount(grid) {
    const tracks = getComputedStyle(grid).gridTemplateColumns;
    if (!tracks || tracks === 'none') return 1;
    return tracks.split(' ').filter(Boolean).length || 1;

  // slightly larger variant, never a blurry one.
  //

  function gallerySizesAttr(grid) {
    return Math.ceil(100 / galleryColumnCount(grid)) + 'vw';

  // cut off mid-thought. The number has to come from the viewport, not from a constant.
  //

  // it in with the rest is the whole point. Guarded at one row so a restored scroll
  // position deep in the page (negative rect.top) can't ask for zero. Everything above
  // the viewport is inside the observer's 9999px top rootMargin and gets revealed anyway.
  function openingTileCount(grid) {

    if (!first) return 0;
    const columns = galleryColumnCount(grid);
    const rect = first.getBoundingClientRect();
    const rowHeight = rect.height + (parseFloat(getComputedStyle(grid).rowGap) || 0);
    if (!rowHeight) return columns;
    const roomToFold = window.innerHeight - rect.top;
    const rows = Math.max(1, Math.ceil(roomToFold / rowHeight));
    return rows * columns;
  }

  // Gallery order matches the order of entries in projects.json's "gallery" array —
      // that's exactly what the admin's drag-and-drop reordering updates. Each entry is
      // {filename, palette} since Aug 2026 (palette used by the lightbox, not the grid).
      const gallery = document.getElementById('project-gallery');
      // Read before the injection, not inside the map: one measurement for the whole
      // grid, and reading it per tile would be a forced layout on every iteration.
      const gallerySizes = gallerySizesAttr(gallery);
      gallery.innerHTML = project.gallery.map((item, i) => `
        <button class="gallery-item" data-reveal data-full="assets/${esc(item.filename)}">
          <img src="assets/${esc(item.filename)}"
               srcset="${esc(srcsetFor(item.filename))}"
               sizes="${esc(gallerySizes)}"
               decoding="async"
               alt="${esc(project.title)} — still ${i + 1}">
        </button>
      `).join('');

      document.getElementById('project-info').style.display = '';

      // The opening wave: the title, the credits and every still on the first screen all
      // lift in together on load, whether or not they clear the fold. See
      // openingTileCount() above for how many that is.
      //
      // Left to the observer alone this was only ever the rows clearing 88% of the
      // viewport height (the -12% bottom rootMargin in site.js), which strands the last
      // row or two of the first screen until a scroll. Filling the wave here rather than
      // pushing the observer's own trigger line down keeps that line where it is for the
      // work grid and the contact block.
      //
      // The header elements ride in the same call rather than a second one so the whole
      // thing stays a single cascade in document order — two separate batches would both
      // start at index 0 and the title would lift alongside the first still.
      //
      // Deferred to activation when this page was prerendered from a hovered link (Sept
      // 2026), so the wave plays when the visitor arrives rather than invisibly ahead of
      // them — see whenActivated() in site.js. The tile count is measured at that moment
      // too, against the viewport the page is actually shown in.
      whenActivated(() => {
        revealBatch([
          document.getElementById('project-title'),
          document.querySelector('.credits')
        ].concat(Array.prototype.slice.call(gallery.children, 0, openingTileCount(gallery))));

        // After the display:none comes off, not before: an IntersectionObserver never
        // reports a display:none element as intersecting, so observing #project-info's
        // children any earlier would leave the title, credits and next-project card stuck
        // at opacity 0 forever. Covers the gallery stills in the same pass — everything
        // the opening wave just claimed is skipped.
        observeReveals();
      });
      wireLightbox();
    })
    .catch((err) => {
      console.error('Impossible de charger le projet:', err);
      document.getElementById('project-not-found').style.display = '';
    });

</script>
</body>
</html>
