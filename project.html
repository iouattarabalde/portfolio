<!DOCTYPE html>
<!--
  project.html — single dynamic template for every project (no more per-project HTML files).
  Reads the project id from the URL query string (?project=slug), looks it up in
  data/projects.json, and renders its gallery + credits. Visited as e.g.
  project.html?project=fleur-de-peau, linked from the work grid on index.html.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Project — Ismael OB</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<!-- Generic sharing card: crawlers don't run JS, so per-project OG tags aren't possible
     on a static host — every project link shares the same site-wide card as index.html. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Ismael OB — Colorist">
<meta property="og:description" content="Color grading for commercials, music videos, film and television. Based in Montreal, available remote.">
<meta property="og:image" content="https://ismaelob.com/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><!-- serves the actual font files, not just the CSS -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=97">
<!-- Same continuous accent-color cycle as index.html, own randomized phase offset per
     page load — no persistence, so navigating between pages can land at a different
     point in the loop each time. See index.html for the full story (this is the
     second implementation — a CSS-only version broke .wordmark span's color twice
     in real testing, replaced with this JS-driven requestAnimationFrame loop). -->
<script>
  (function () {
    var CYCLE_MS = 60000; // full 360° loop duration
    var L = 0.65, C = 0.09; // oklch lightness/chroma — perceptually uniform brightness across every hue, unlike hsl()
    var html = document.documentElement;
    var startOffset = Math.random() * CYCLE_MS; // randomizes where in the loop this page load begins

    function oklchToHex(hueDeg) {
      var h = hueDeg * Math.PI / 180;
      var a = C * Math.cos(h);
      var b = C * Math.sin(h);
      var l_ = L + 0.3963377774 * a + 0.2158037573 * b;
      var m_ = L - 0.1055613458 * a - 0.0638541728 * b;
      var s_ = L - 0.0894841775 * a - 1.2914855480 * b;
      var l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
      var r = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
      var g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
      var bl = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
      function toSrgb(c) {
        c = Math.max(0, Math.min(1, c));
        return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
      }
      function hex2(c) {
        var n = Math.round(toSrgb(c) * 255).toString(16);
        return n.length === 1 ? '0' + n : n;
      }
      return '#' + hex2(r) + hex2(g) + hex2(bl);
    }

    var UPDATE_INTERVAL_MS = 120; // ~8x/sec — imperceptibly different from every frame for a 60s cycle, but ~8x less work (see index.html for the full reasoning)
    var lastUpdate = -Infinity;

    function tick(now) {
      if (now - lastUpdate >= UPDATE_INTERVAL_MS) {
        var elapsed = (now + startOffset) % CYCLE_MS;
        var hue = (elapsed / CYCLE_MS) * 360;
        html.style.setProperty('--accent', oklchToHex(hue));
        lastUpdate = now;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
<script src="i18n.js"></script>
</head>
<body>

<div class="grain-overlay" aria-hidden="true"></div>

<nav class="site-nav">
  <div class="brand">
    <a href="index.html" class="wordmark">ISMAEL<span>OB</span></a>
    <span class="nav-eyebrow"><span data-fr data-key="nav.eyebrow"></span><span data-en data-key="nav.eyebrow"></span></span>
  </div>
  <div class="nav-links">
    <a href="index.html#work"><span data-fr data-key="nav.work"></span><span data-en data-key="nav.work"></span></a>
    <a href="index.html#contact"><span data-fr data-key="nav.contact"></span><span data-en data-key="nav.contact"></span></a>
    <button id="lang-toggle" type="button" aria-label="Toggle language">FR</button>
  </div>
</nav>

<!-- Filled by JS below once the project is found in projects.json -->
<section class="project-gallery" id="project-gallery"></section>

<!-- Hidden until the project is found and rendered (display:none avoids a flash of empty content) -->
<section class="project-info" id="project-info" style="display:none;">
  <div class="bottom-glow" aria-hidden="true">
    <div class="bottom-glow-gradient"></div>
  </div>
  <div class="project-info-main">
    <a class="project-back" href="index.html#work">← <span data-fr data-key="project.back"></span><span data-en data-key="project.back"></span></a>
    <h1 class="project-title" id="project-title"></h1>
    <dl class="credits">
      <div>
        <dt><span data-fr data-key="project.type_label"></span><span data-en data-key="project.type_label"></span></dt>
        <dd id="project-type">—</dd>
      </div>
      <div id="project-client-wrap" style="display:none;">
        <dt><span data-fr data-key="project.client_label"></span><span data-en data-key="project.client_label"></span></dt>
        <dd id="project-client">—</dd>
      </div>
      <div id="project-artist-wrap" style="display:none;">
        <dt><span data-fr data-key="project.artist_label"></span><span data-en data-key="project.artist_label"></span></dt>
        <dd id="project-artist">—</dd>
      </div>
      <div>
        <dt><span data-fr data-key="project.director_label"></span><span data-en data-key="project.director_label"></span></dt>
        <dd id="project-director">—</dd>
      </div>
      <div>
        <dt><span data-fr data-key="project.dp_label"></span><span data-en data-key="project.dp_label"></span></dt>
        <dd id="project-dp">—</dd>
      </div>
    </dl>
  </div>

  <!-- Jump straight to the next project without going back through the grid — requested
       Aug 2026. "Next" means the following entry in projects.json's own order (same
       order the admin's drag-and-drop reordering controls, same order the homepage grid
       renders in before any type filter is applied — there's no filter state to inherit
       here), wrapping back to the first project after the last one. Hidden entirely by
       JS if there's only one project total, since a link back to itself isn't useful.
       Populated + shown by JS below alongside the rest of project-info. -->
  <a class="next-project" id="next-project" href="#" style="display:none;">
    <p class="next-project-label"><span data-fr data-key="project.next_label"></span><span data-en data-key="project.next_label"></span> →</p>
    <img class="next-project-thumb" id="next-project-thumb" alt="" loading="lazy">
    <p class="next-project-title" id="next-project-title"></p>
  </a>
</section>

<!-- Shown instead of project-info if the ?project= id doesn't match anything in projects.json -->
<section class="project-info" id="project-not-found" style="display:none;">
  <p class="eyebrow"><span data-fr data-key="project.not_found_eyebrow"></span><span data-en data-key="project.not_found_eyebrow"></span></p>
  <h1 class="project-title">
    <span data-fr data-key="project.not_found_heading"></span>
    <span data-en data-key="project.not_found_heading"></span>
  </h1>
  <a class="project-back" href="index.html#work">← <span data-fr data-key="project.back"></span><span data-en data-key="project.back"></span></a>
</section>

<!-- Full-screen image viewer, opened by clicking any gallery thumbnail (see wireLightbox below).
     Prev/next live inside .lightbox-content (not as siblings) so that on mobile they can be
     pulled into a row directly under the palette strip instead of floating near the bottom
     of the viewport — see .lightbox-nav-row in style.css, Aug 2026. On desktop they're still
     positioned absolute against .lightbox itself (unaffected by this nesting, since
     .lightbox-content has no position of its own and therefore isn't a containing block). -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" id="lightbox-close" type="button">✕ <span data-fr data-key="lightbox.close"></span><span data-en data-key="lightbox.close"></span></button>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-palette" id="lightbox-palette" aria-hidden="true"></div>
    <div class="lightbox-nav-row">
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous image">←</button>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next image">→</button>
    </div>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // project.html script overview:
  //   1. Language toggle (same pattern as index.html)
  //   2. Lightbox (click a still to enlarge; close via ✕, Escape, or clicking the backdrop)
  //   3. Load i18n.js (all static copy + type acronyms) and the requested project from
  //      data/projects.json in parallel, then render both
  // ---------------------------------------------------------------

  const btn = document.getElementById('lang-toggle');
  const body = document.body;
  const stored = localStorage.getItem('iob-lang');
  if (stored === 'fr') body.classList.add('lang-fr');
  function updateLangButton() {
    btn.textContent = body.classList.contains('lang-fr') ? 'EN' : 'FR';
  }
  updateLangButton();
  btn.addEventListener('click', () => {
    body.classList.toggle('lang-fr');
    localStorage.setItem('iob-lang', body.classList.contains('lang-fr') ? 'fr' : 'en');
    document.documentElement.lang = body.classList.contains('lang-fr') ? 'fr' : 'en';
    updateLangButton();
    renderProjectType(); // re-run so the Type field switches acronym language too
  });

  // Lightbox: wireLightbox() attaches click handlers to gallery thumbnails, opening each
  // at its own index. It's called again after the gallery is (re)rendered from JSON,
  // since those <button> elements don't exist yet when this script first runs.
  // Navigation (arrows + keyboard) loops: past the last image wraps to the first and
  // vice versa, via the (i + length) % length trick in openLightboxAt.
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxPalette = document.getElementById('lightbox-palette');
  const lightboxPrev = document.getElementById('lightbox-prev');
  const lightboxNext = document.getElementById('lightbox-next');
  const lightboxCloseBtn = document.getElementById('lightbox-close');
  let lightboxIndex = -1;
  let lightboxTrigger = null; // element to return focus to on close — set only on the initial open, not on prev/next navigation

  // Keeps the palette strip exactly as wide as the image actually renders at — measured
  // directly in JS rather than relied on via a CSS percentage-height chain (the lightbox
  // wrapper's height is content-driven, not a definite value, which is exactly the kind
  // of ambiguous case that behaves inconsistently across browsers without live testing
  // to verify it). Runs on every image load, not just the first, since different stills
  // can have different aspect ratios and therefore different rendered widths.
  lightboxImg.addEventListener('load', () => {
    lightboxPalette.style.width = lightboxImg.offsetWidth + 'px';
  });

  // Runs updateFn as a same-document View Transition when supported, otherwise just
  // runs it directly. Temporarily adds .same-doc-transition to <body> for the duration
  // — see the CSS rule of the same name in style.css for why (excludes the nav from
  // its own view-transition-name, which otherwise renders it above everything else
  // during the transition regardless of normal z-index — the bug that first showed up
  // right here, in this exact crossfade, now generalized into this shared helper so it
  // doesn't need re-solving for every new same-document transition). Same helper
  // (duplicated) also drives the work-grid filter crossfade in index.html. Aug 2026.
  function withViewTransition(updateFn) {
    if (!document.startViewTransition) {
      updateFn();
      return;
    }
    document.body.classList.add('same-doc-transition');
    const transition = document.startViewTransition(updateFn);
    transition.finished.finally(() => {
      document.body.classList.remove('same-doc-transition');
    });
  }

  // Crossfades between stills when navigating an already-open lightbox, requested Aug
  // 2026 — the initial open (lightbox currently closed) skips this, there's nothing to
  // crossfade FROM yet. Uses the same-document View Transitions API rather than a
  // manual opacity animation: the browser snapshots the current image, runs the DOM
  // update, snapshots the new image, and crossfades between them natively. #lightbox-img
  // has its own view-transition-name (see style.css) so only the image itself
  // crossfades, not the whole page. Falls back to an instant swap — today's behavior —
  // in browsers without support, handled inside withViewTransition() above; no separate
  // fallback animation to maintain.
  function openLightboxAt(index) {
    if (!currentProject) return;
    const gallery = currentProject.gallery;
    lightboxIndex = (index + gallery.length) % gallery.length; // loops both directions
    const item = gallery[lightboxIndex]; // {filename, palette} — see data/projects.json, Aug 2026
    const hasMultiple = gallery.length > 1;
    const isNavigating = lightbox.classList.contains('open');

    function applyImage() {
      lightboxImg.src = `assets/${item.filename}`;
      lightboxImg.alt = `${currentProject.title} — still ${lightboxIndex + 1}`;
      lightboxPalette.innerHTML = (item.palette || []).map((hex) => `<div style="background:${hex}"></div>`).join('');
      lightbox.classList.add('open');
      lightboxPrev.style.display = hasMultiple ? '' : 'none';
      lightboxNext.style.display = hasMultiple ? '' : 'none';
    }

    if (isNavigating) {
      withViewTransition(applyImage);
    } else {
      applyImage();
    }
  }
  function wireLightbox() {
    document.querySelectorAll('.gallery-item').forEach((item, idx) => {
      item.addEventListener('click', () => {
        lightboxTrigger = item; // fires for both mouse clicks and Enter/Space on the button
        openLightboxAt(idx);
        lightboxCloseBtn.focus(); // move keyboard focus into the lightbox on open
      });
    });
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
    lightboxPalette.innerHTML = '';
    if (lightboxTrigger) {
      lightboxTrigger.focus(); // return focus to the thumbnail that opened it
      lightboxTrigger = null;
    }
  }
  // Only the lightbox's own currently-visible buttons (prev/next are display:none
  // when the gallery has just one image) — used to keep Tab/Shift+Tab cycling inside
  // the lightbox instead of escaping to page content hidden behind the overlay.
  function getLightboxFocusable() {
    return Array.from(lightbox.querySelectorAll('button')).filter((el) => el.offsetParent !== null);
  }
  lightboxCloseBtn.addEventListener('click', closeLightbox);
  lightboxPrev.addEventListener('click', (e) => { e.stopPropagation(); openLightboxAt(lightboxIndex - 1); });
  lightboxNext.addEventListener('click', (e) => { e.stopPropagation(); openLightboxAt(lightboxIndex + 1); });
  let lastSwipeTime = 0;
  lightbox.addEventListener('click', (e) => {
    if (Date.now() - lastSwipeTime < 300) return; // ignore the synthetic click that follows a swipe's touchend, see the swipe listener below for why
    if (e.target === lightbox) closeLightbox(); // only closes on backdrop clicks, not the image itself
  });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') { closeLightbox(); return; }
    if (e.key === 'ArrowLeft') { openLightboxAt(lightboxIndex - 1); return; }
    if (e.key === 'ArrowRight') { openLightboxAt(lightboxIndex + 1); return; }
    if (e.key === 'Tab') {
      const focusable = getLightboxFocusable();
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });

  // Swipe to navigate on mobile, requested Aug 2026 — reuses openLightboxAt() exactly
  // like the arrow buttons and keyboard arrows do, so it gets the same crossfade
  // transition and index-looping for free, nothing new to maintain there. Requires the
  // gesture to be predominantly horizontal (deltaX bigger than deltaY) so an incidental
  // vertical touch doesn't get misread as a swipe, and a minimum distance so a simple
  // tap never triggers navigation. Right-to-left swipe (deltaX negative) advances to
  // the next image, matching the standard mobile gallery convention. Vertical panning
  // itself (which used to drag the page behind the overlay) is blocked at the CSS
  // level via touch-action: pan-x on .lightbox, not here — that's what stops the
  // background from moving on an up/down swipe, this handler only reads the gesture.
  let touchStartX = 0;
  let touchStartY = 0;
  lightbox.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  lightbox.addEventListener('touchend', (e) => {
    if (!currentProject || currentProject.gallery.length <= 1) return;
    const deltaX = e.changedTouches[0].clientX - touchStartX;
    const deltaY = e.changedTouches[0].clientY - touchStartY;
    const SWIPE_THRESHOLD = 50;
    if (Math.abs(deltaX) < SWIPE_THRESHOLD || Math.abs(deltaX) < Math.abs(deltaY)) return;
    lastSwipeTime = Date.now();
    openLightboxAt(deltaX > 0 ? lightboxIndex - 1 : lightboxIndex + 1);
  }, { passive: true });

  // Which project to show comes from the URL, e.g. project.html?project=fleur-de-peau
  const params = new URLSearchParams(window.location.search);
  const projectId = params.get('project');
  let currentProject = null; // cached after fetch so renderProjectType() can re-run on language toggle

  function renderProjectType() {
    if (!currentProject) return;
    const isFr = body.classList.contains('lang-fr');
    document.getElementById('project-type').textContent = projectTypeAcronym(currentProject.type, isFr) || '—';
  }

  // i18n and the project data are independent fetches, loaded in parallel — applyStrings()
  // fills every data-key element (labels, back link, etc.), and the project.type acronym
  // rendered by renderProjectType() also depends on i18n.js's PROJECT_TYPES being loaded.
  Promise.all([
    loadI18n(),
    fetch('data/projects.json').then((r) => r.json())
  ])
    .then(([, data]) => {
      applyStrings();

      const project = data.projects.find((p) => p.id === projectId);
      if (!project) {
        document.getElementById('project-not-found').style.display = '';
        return;
      }
      currentProject = project;

      document.getElementById('page-title').textContent = project.title + ' — Ismael OB';
      document.getElementById('project-title').textContent = project.title;
      renderProjectType();
      if (project.client) {
        document.getElementById('project-client').textContent = project.client;
        document.getElementById('project-client-wrap').style.display = '';
      }
      if (project.artist) {
        document.getElementById('project-artist').textContent = project.artist;
        document.getElementById('project-artist-wrap').style.display = '';
      }
      document.getElementById('project-director').textContent = project.director || '—';
      document.getElementById('project-dp').textContent = project.dp || '—';

      // Jump-to-next-project card — "next" is the following entry in projects.json's
      // own order, wrapping back to the first project after the last one. Hidden
      // entirely if there's only one project total (a link back to itself isn't useful).
      if (data.projects.length > 1) {
        const currentIndex = data.projects.findIndex((p) => p.id === projectId);
        const nextProject = data.projects[(currentIndex + 1) % data.projects.length];
        const nextLink = document.getElementById('next-project');
        const nextThumb = document.getElementById('next-project-thumb');
        nextLink.href = `project.html?project=${encodeURIComponent(nextProject.id)}`;
        nextThumb.src = `assets/${nextProject.thumbnail}`;
        nextThumb.alt = nextProject.title;
        nextThumb.style.objectPosition = nextProject.thumbnailFocus || '50% 50%';
        document.getElementById('next-project-title').textContent = nextProject.title;
        nextLink.style.display = '';
      }

      // Gallery order matches the order of entries in projects.json's "gallery" array —
      // that's exactly what the admin's drag-and-drop reordering updates. Each entry is
      // {filename, palette} since Aug 2026 (palette used by the lightbox, not the grid).
      const gallery = document.getElementById('project-gallery');
      gallery.innerHTML = project.gallery.map((item, i) => `
        <button class="gallery-item" data-full="assets/${item.filename}">
          <img src="assets/${item.filename}" alt="${project.title} — still ${i + 1}" loading="lazy">
        </button>
      `).join('');

      document.getElementById('project-info').style.display = '';
      wireLightbox();
    })
    .catch((err) => {
      console.error('Impossible de charger le projet:', err);
      document.getElementById('project-not-found').style.display = '';
    });

  // Background color and grain level — editable in the admin (Design tab). No reel/
  // halo on this page, but --bg still needs to match the rest of the site, and since
  // .grain-overlay (Aug 2026) is a page-wide layer present on every page rather than
  // scoped to specific reel/contact glows, --grain-level needs to reach here too now —
  // previously this page had nothing grain-driven to feed, so only --bg was applied.
  // Same pattern as index.html: silently no-ops if data/design.json doesn't exist yet.
  fetch('data/design.json')
    .then((r) => r.json())
    .then((d) => {
      const root = document.documentElement.style;
      if (d.bg) root.setProperty('--bg', d.bg);
      if (d.grainLevel != null) root.setProperty('--grain-level', d.grainLevel);
    })
    .catch(() => {});
</script>
</body>
</html>
