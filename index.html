<!DOCTYPE html>
<!--
  index.html — homepage: hero reel, work grid (built from data/projects.json), contact info.
  Nav labels: "Projects" -> #work, "Contact" -> #contact.
  style.css, site.js and i18n.js are all versioned (?v=N) as a cache-buster, on one
  shared number; a GitHub Action bumps it across ALL pages that link them whenever any of
  them changes, so browsers can't keep serving a stale stylesheet or a stale script.
-->
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Les deux langues cohabitent dans le DOM ([data-fr] / [data-en], masquées par CSS), alors
     la traduction automatique de Chrome retraduit les deux copies et donne n'importe quoi.
     Ces trois signaux (meta google, translate="no" et .notranslate sur <html>) désactivent
     la barre "Traduire cette page" : le toggle FR/EN du site reste la seule bascule. -->
<meta name="google" content="notranslate">
<title>Ismael OB — Colorist</title>
<meta name="description" content="Ismael OB, colorist based in Montreal. Color grading for commercials, music videos, film and television.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<!-- Social sharing card (Open Graph + Twitter). og-image.jpg is a 1200x630 crop of a
     project still; swap the file in assets/ to change what shows up when the URL is
     shared on iMessage, LinkedIn, Slack, etc. URLs must be absolute for crawlers. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://ismaelob.com/">
<meta property="og:title" content="Ismael OB — Colorist">
<meta property="og:description" content="Color grading for commercials, music videos, film and television. Based in Montreal, available remote.">
<meta property="og:image" content="https://ismaelob.com/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_CA">
<meta property="og:locale:alternate" content="fr_CA">
<meta name="twitter:card" content="summary_large_image">
<!-- The two faces used above the fold, fetched alongside the stylesheet rather than once it has
     been parsed. Self-hosted since Sept 2026; see "Typefaces" in style.css. -->
<link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=135">
<!-- The JSON this page renders from, fetched while the HTML is still parsing rather than
     once the scripts at the bottom of <body> get round to it (Sept 2026). crossorigin is
     what makes the preload's request match fetch()'s default same-origin credentials
     mode; without it the browser would download each file twice. -->
<link rel="preload" href="data/projects.json?v=135" as="fetch" crossorigin>
<link rel="preload" href="data/strings.json?v=135" as="fetch" crossorigin>
<link rel="preload" href="data/settings.json?v=135" as="fetch" crossorigin>
<!-- Shared behaviours for every page: the cycling accent colour (self-starting, which
     is why this loads here in <head> rather than at the end of <body>), plus esc(),
     prefersReducedMotion(), observeReveals() and initLangToggle()
     used by the script at the bottom of this file. (withViewTransition() lives there too
     but is only used by project.html's lightbox now.) See site.js for the story on each. -->
<script src="site.js?v=135"></script>
<script src="i18n.js?v=135"></script>
<!-- Prerenders a project page from its card (Sept 2026). In Chrome and Edge, hovering a
     card for a moment (or starting to tap it) loads that page
     invisibly, so the click shows it at once instead of waiting on its data and stills.
     Other browsers ignore this block. Every project is the same template with a different
     ?project=, so one rule on the pathname covers them all. The gallery's entrance waits for
     the page to actually be shown; see whenActivated() in site.js. -->
<script type="speculationrules">
{
  "prerender": [
    { "where": { "href_matches": { "pathname": "/project.html" } }, "eagerness": "moderate" }
  ]
}
</script>
</head>
<body>

<div class="grain-overlay" aria-hidden="true"></div>

<nav class="site-nav">
  <div class="brand">
    <a href="index.html" class="wordmark">ISMAEL<span>OB</span></a>
    <span class="nav-eyebrow"><span data-fr data-key="nav.eyebrow"></span><span data-en data-key="nav.eyebrow"></span></span>
  </div>
  <div class="nav-links">
    <a href="#work"><span data-fr data-key="nav.work"></span><span data-en data-key="nav.work"></span></a>
    <a href="#contact"><span data-fr data-key="nav.contact"></span><span data-en data-key="nav.contact"></span></a>
    <button id="lang-toggle" type="button" aria-label="Toggle language">FR</button>
  </div>
</nav>

<!-- Hero: self-hosted reel, sized/muted via the script at the bottom.

     TWO SOURCES, AV1 FIRST — Aug 2026. The browser takes the first <source> it can
     decode, so ordering is the whole mechanism. The reel is grain-heavy footage, and
     grain is what compresses worst: measured on the 2026 master, x264 wants ~7.3Mbps
     (~166MB) to hold that texture, but GitHub hard-rejects any file over 100MB. The old
     single H.264 shipped at 3.7Mbps — about half what the grain needed, which is why it
     looked mushy. AV1 carries the same real grain for roughly a third of the bits, so
     reel.av1.mp4 is what almost everyone actually gets. reel.mp4 stays purely as a
     fallback for Safari <=16 / iOS <=16, which can't decode AV1.

     The codecs="av01..." string is load-bearing: if it doesn't match the file, Safari
     silently skips AV1 and drops to the fallback. scripts/encode_reel.py writes the
     correct string for whatever it just encoded into this tag itself — don't guess it.

     preload="metadata", NOT "auto" — changed Aug 2026 after an audit. preload="auto"
     invites the browser to fetch as much of the reel as it can the moment the page
     loads, for every visitor, whether or not they ever watch it. Against GitHub Pages'
     ~100GB/month soft bandwidth ceiling that's a real throttling risk. "metadata"
     fetches only the header, then the autoplay attribute + the explicit play() call
     below start a normal progressive download — playback still begins on its own, it
     just streams instead of racing to buffer the whole file up front. The poster
     (assets/hero-poster.jpg) is what actually fills the frame on first paint either
     way, so there's nothing visible to lose here. fetchpriority="high" is dropped for
     the same reason: it was telling the browser to prioritize that download over the
     project thumbnails people actually scroll to.

     The poster is frame 0 of the cut, not an arbitrary still — it eases from grayscale
     to colour on 'loadeddata' (see #reel-video / .is-ready in style.css), so it has to
     be the exact frame playback starts on or the handoff visibly jumps. -->
<header class="hero">
  <h1 class="sr-only">
    <span data-fr>Ismael OB — Coloriste basé à Montréal</span>
    <span data-en>Ismael OB — Colorist based in Montreal</span>
  </h1>
  <div class="reel-frame">
    <div class="reel-embed">
      <video id="reel-video" autoplay muted loop playsinline webkit-playsinline preload="metadata" poster="assets/hero-poster.jpg" title="Ismael OB - Demo Reel" disableRemotePlayback disablePictureInPicture>
        <source src="video/reel.av1.mp4" type='video/mp4; codecs="av01.0.08M.10"'>
        <source src="video/reel.mp4" type="video/mp4">
      </video>
      <button id="fullscreen-toggle" type="button" aria-label="Fullscreen">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 9V4H9M15 4H20V9M20 15V20H15M9 20H4V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="sound-toggle" type="button" aria-label="Toggle sound">
        <svg id="icon-muted" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9V15H7L12 20V4L7 9H3Z" fill="currentColor"/>
          <path d="M16 8L21 16M21 8L16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg id="icon-unmuted" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none;">
          <path d="M3 9V15H7L12 20V4L7 9H3Z" fill="currentColor"/>
          <path d="M16 8.5C17 9.5 17.5 10.7 17.5 12C17.5 13.3 17 14.5 16 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M18.5 6C20.2 7.7 21 9.8 21 12C21 14.2 20.2 16.3 18.5 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- Work grid: empty on load, filled by renderWorkGrid() from data/projects.json -->
<section id="work">
  <h2 class="sr-only"><span data-fr data-key="work.heading"></span><span data-en data-key="work.heading"></span></h2>
  <div class="work-filter" id="category-filter" data-reveal></div>

  <div class="work-grid" id="work-grid"></div>

  <!-- Desktop-only (hover-capable devices): shows whichever card is currently
       hovered, in place of the old always-rendered per-card caption. See
       #work-grid's mouseover/mouseout delegation in the script below. -->
  <div class="work-info-bar" id="work-info-bar" aria-hidden="true">
    <div class="info-bar-content" id="info-bar-content">
      <div class="info-bar-main">
        <span class="info-bar-type" id="info-bar-type"></span>
        <span class="info-bar-title" id="info-bar-title"></span>
        <span class="info-bar-credit" id="info-bar-credit"></span>
      </div>
      <span class="info-bar-index" id="info-bar-index"></span>
    </div>
  </div>
</section>

<!-- Contact + site footer. Three columns (heading/bio, links/meta, photo) inside a
     1400px measure, then the footer bar — see the Sept 2026 note in style.css for why
     it's shaped this way. #contact is the last section on the page, so the footer bar
     lives in here rather than in a <footer> of its own. -->
<section class="contact" id="contact">
  <div class="bottom-glow" aria-hidden="true">
    <div class="bottom-glow-gradient"></div>
  </div>
  <div class="contact-columns">
    <!-- All the copy sits in one column beside the photo; .contact-intro and
         .contact-details are kept as separate blocks only so the availability line stays
         grouped with the links rather than with the bio. See style.css. -->
    <div class="contact-text">
      <div class="contact-intro" data-reveal>
        <h2 class="contact-title">
          <span data-fr data-key="contact.heading"></span>
          <span data-en data-key="contact.heading"></span>
        </h2>
        <p class="contact-bio">
          <span data-fr id="contact-bio-fr"></span><span data-en id="contact-bio-en"></span>
        </p>
      </div>
      <div class="contact-details" data-reveal>
        <div class="contact-links">
          <div class="contact-link-group">
            <span class="contact-link-label"><span data-fr data-key="contact.email_label"></span><span data-en data-key="contact.email_label"></span></span>
            <a id="contact-email" class="contact-link" href="#" target="_blank" rel="noopener">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="14" stroke="currentColor" stroke-width="1.6"/><path d="M3 7.5L12 13.5L21 7.5" stroke="currentColor" stroke-width="1.6"/></svg>
              <span id="contact-email-text"></span>
            </a>
          </div>
          <div class="contact-link-group">
            <span class="contact-link-label">Instagram</span>
            <a id="contact-instagram" class="contact-link" href="#" target="_blank" rel="noopener">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg>
              <span id="contact-instagram-text"></span>
            </a>
          </div>
        </div>
        <p class="contact-meta">
          <span data-fr id="contact-location-fr"></span><span data-en id="contact-location-en"></span>
          — <span data-fr id="contact-availability-fr"></span><span data-en id="contact-availability-en"></span>
        </p>
      </div>
    </div>
    <div class="contact-photo-frame" data-reveal>
      <img id="contact-photo" class="contact-photo" src="" alt="Ismael OB">
    </div>
  </div>

  <div class="contact-footer" data-reveal>
    <p class="contact-copyright">
      © <span id="contact-year"></span> Ismael OB —
      <span data-fr data-key="nav.eyebrow"></span><span data-en data-key="nav.eyebrow"></span>
    </p>
    <!-- Filled by renderFooterNav() from PROJECT_TYPES, same source as the filter row. -->
    <nav class="contact-footer-nav" id="contact-footer-nav"></nav>
    <button type="button" class="contact-top" id="contact-top">
      <span data-fr data-key="contact.top"></span><span data-en data-key="contact.top"></span>
    </button>
  </div>
</section>


<script>
  // ---------------------------------------------------------------
  // index.html script overview:
  //   1. Language toggle (FR/EN), persisted in localStorage
  //   2. Hero reel sizing (fills viewport below nav) + mute/unmute button
  //   3. Work grid, rendered from data/projects.json once data/strings.json (i18n.js)
  //      has also loaded, since card captions need the type acronyms it provides.
  //      Re-rendered on language change so those acronyms switch too.
  // ---------------------------------------------------------------

  const body = document.body;
  // Toggle itself lives in site.js; the callback refreshes the three things on this
  // page built in JS, which would otherwise keep their old-language labels: the filter
  // bar, the card type tags (AD/PUB, MV/CLIP...), and the footer's category links.
  // The cards are relabelled in place rather than re-rendered (Sept 2026): rebuilding
  // the grid threw every card away, so switching language blanked all 32 and replayed
  // their entrance, for what is a change to one short tag per card.
  initLangToggle(() => {
    renderCategoryFilter();
    renderFooterNav();
    updateCardLabels();
  });

  // Sizes the reel so it exactly fills the space below the sticky nav, fully visible
  // without scrolling on load. Math: available vertical space = viewport height minus
  // nav height minus the hero's own padding. Since the reel is 16:9, we convert that
  // available height into the matching width (height * 16/9) and cap the frame's
  // max-width there — the CSS aspect-ratio box then derives the height from that width.
  function sizeReel() {
    const nav = document.querySelector('.site-nav');
    const hero = document.querySelector('.hero');
    const frame = document.querySelector('.reel-frame');
    if (!nav || !hero || !frame) return;
    const navH = nav.offsetHeight;
    const heroStyles = getComputedStyle(hero);
    const heroPadV = parseFloat(heroStyles.paddingTop) + parseFloat(heroStyles.paddingBottom);
    const available = window.innerHeight - navH - heroPadV - 4; // 4px = small safety margin
    const maxWidthFromHeight = available * (16 / 9);
    frame.style.maxWidth = Math.max(280, maxWidthFromHeight) + 'px'; // 280px floor so it never gets absurdly small
  }
  // Called synchronously here (not just on 'load') so the frame is sized correctly
  // from the very first paint. It previously only ran on window.load, which waits for
  // every resource on the page — including the video itself, then still preload="auto" — to
  // finish, so the reel visibly rendered at the CSS fallback size (max-width: 1400px)
  // first and then snapped to its real computed size once 'load' finally fired. Safe
  // to call this early: it only reads the nav's offsetHeight and the hero's computed
  // padding, both already resolved once the elements exist in the DOM, and doesn't
  // depend on video/image/font loading at all. Aug 2026.
  sizeReel();

  // Publishes the sticky nav's measured height as --nav-h. style.css uses it for two
  // things that both have to match the nav exactly: where #work and #contact land when
  // their nav link is clicked (scroll-margin-top), and the minimum height #contact needs
  // in order to be able to reach that position at all. Measured rather than hardcoded
  // because the nav grows and shrinks with the webfont swap and with browser zoom, and a
  // stale constant shows up directly as the section landing at the wrong height.
  function syncNavHeight() {
    const nav = document.querySelector('.site-nav');
    if (!nav) return;
    document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
  }
  syncNavHeight(); // synchronous first pass, same reasoning as sizeReel() above

  window.addEventListener('load', () => { sizeReel(); syncNavHeight(); refreshHeroParallax(); scrollToHashTarget(); });

  // Fragment-scroll fix, Aug 2026: the browser's native anchor scroll (on initial
  // navigation to index.html#work or #contact, e.g. from project.html's nav or "Back
  // to Projects" link) fires before sizeReel(), the work-grid fetch, and the contact
  // fetch finish resizing the page below the hero — so the native scroll lands on a
  // layout that's about to shift, and the final position drifts with network timing.
  // We re-run the scroll manually from every call site that can move #work or
  // #contact, once each has settled. Idempotent and cheap, so calling it more than
  // once (in case two finish close together) is harmless — the last call wins.
  //
  // Coming back through history is different (Sept 2026) — the back button, and "Back to
  // projects" now too (initBackToGrid() in site.js). The visitor should land where they
  // left, not at the top of #work. Usually the browser's back/forward cache restores the
  // page whole and none of this runs. When it can't, the page reloads, and the browser's
  // own scroll restoration fires before the grid has been built: the page is still too
  // short to reach the old position, so it stops short (46px in testing) and doesn't try
  // again. The position is saved per history entry on the way out, and put back here once
  // each late layout change lands — unless the visitor has already started scrolling.
  const arrivedThroughHistory = (performance.getEntriesByType('navigation')[0] || {}).type === 'back_forward';
  function historyScrollKey() {
    const entry = window.navigation && navigation.currentEntry;
    return 'iob-scroll:' + (entry ? entry.key : location.href);
  }
  window.addEventListener('pagehide', () => {
    try { sessionStorage.setItem(historyScrollKey(), String(window.scrollY)); } catch (err) { /* storage unavailable: nothing to restore later */ }
  });
  let visitorScrolled = false;
  ['wheel', 'touchstart', 'keydown'].forEach((type) => {
    window.addEventListener(type, () => { visitorScrolled = true; }, { once: true, passive: true });
  });

  function scrollToHashTarget() {
    if (arrivedThroughHistory) {
      let saved = NaN;
      try { saved = parseFloat(sessionStorage.getItem(historyScrollKey())); } catch (err) { /* see pagehide above */ }
      if (!visitorScrolled && isFinite(saved) && Math.abs(window.scrollY - saved) > 1) {
        window.scrollTo({ top: saved, behavior: 'instant' });
      }
      return;
    }
    if (!location.hash) return;
    const target = document.querySelector(location.hash);
    if (target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  // Hero reel parallax: the reel shrinks and fades as you scroll past it, requested Aug
  // 2026, strengthened Sept 2026. Direct scroll-value-following via CSS custom
  // properties — same technique the earlier nav-fade-on-scroll experiment used, before
  // that was reverted for unrelated visual reasons, not technical ones (the pattern
  // itself worked fine). There's no "before" state that needs to be painted first, just
  // two values continuously following the current scroll position every frame.
  // rAF-throttled, matching the resize listener below. Skips registering the listener at
  // all for prefers-reduced-motion, rather than relying only on the CSS override to make
  // it inert.
  //
  // The travel used to be a flat 5% scale over a hardcoded 600px of scroll. Both were
  // wrong: 5% over a 900px-tall hero is small enough that nobody reads it as motion, and
  // 600px is an arbitrary distance that completes at a completely different point on a
  // 900px desktop hero than on a 740px phone one — the same scroll gesture produced
  // different results per device. It's now a 10% scale plus a downward drift, measured
  // against the hero's own height, so the effect finishes exactly as the hero leaves on
  // every viewport. Both properties are compositor-only, and both are deliberately the
  // independent transform properties rather than opacity or the transform shorthand,
  // which hero-enter owns for the first 0.8s — see .reel-frame in style.css.
  //
  // Only the fallback now (Sept 2026): where scroll-driven animations exist, style.css runs
  // the same parallax on a view timeline instead and this listener is never registered.
  // See the note above @keyframes hero-parallax.
  let refreshHeroParallax = () => {};
  const reelFrameEl = document.querySelector('.reel-frame');
  const cssParallax = window.CSS && CSS.supports && CSS.supports('animation-timeline: view()');
  if (reelFrameEl && !prefersReducedMotion() && !cssParallax) {
    const heroEl = document.querySelector('.hero');
    let parallaxDistance = 1;
    let parallaxTicking = false;
    function updateHeroParallax() {
      const progress = Math.min(Math.max(window.scrollY / parallaxDistance, 0), 1);
      reelFrameEl.style.setProperty('--parallax-scale', (1 - progress * 0.10).toFixed(4));
      reelFrameEl.style.setProperty('--parallax-shift', (progress * 48).toFixed(1) + 'px');
      parallaxTicking = false;
    }
    // Re-measured rather than cached once: the hero is sized in dvh, so it changes with
    // orientation and with a mobile browser's collapsing URL bar. Math.max keeps the
    // division safe if this is ever called before the hero has a height.
    refreshHeroParallax = () => {
      parallaxDistance = Math.max(heroEl ? heroEl.offsetHeight : 0, 1);
      updateHeroParallax();
    };
    window.addEventListener('scroll', () => {
      if (!parallaxTicking) {
        requestAnimationFrame(updateHeroParallax);
        parallaxTicking = true;
      }
    }, { passive: true });
    refreshHeroParallax(); // sets the correct value immediately (e.g. reloading mid-scroll)
  }

  // Start watching everything that carries data-reveal in the page's own markup — the
  // filter bar, and the four blocks of the contact section. The work grid's cards are
  // built later by renderWorkGrid(), which calls observeReveals() on them itself.
  observeReveals();

  // Freeze-frame color reveal: the poster (and any video frame) renders desaturated
  // via CSS until the reel has enough data to actually play, then eases into full
  // color — see #reel-video / #reel-video.is-ready in style.css. 'loadeddata' is the
  // right signal here (not 'canplay'/'canplaythrough'): it's the earliest point a real
  // frame exists, matching "starts B&W, gains color as the video loads" rather than
  // waiting for enough buffer to guarantee uninterrupted playback. readyState check
  // covers the case the video already has a frame by the time this listener attaches
  // (e.g. a fast cache hit) — 'loadeddata' wouldn't fire again for it. The 'error'
  // fallback keeps a failed load from leaving the poster stuck grayscale forever.
  // Aug 2026.
  //
  // Once that fade has finished, .is-settled takes the filter off entirely (Sept 2026).
  // grayscale(0) looks identical to no filter, but it is still a filter: the browser keeps
  // running every decoded frame of the reel through it, and a filtered <video> can't be
  // handed to the system's hardware video path. The timeout is the backstop for a
  // transitionend that never arrives (a background tab, say).
  const reelVideoEl = document.getElementById('reel-video');
  if (reelVideoEl) {
    const settleReelColor = () => reelVideoEl.classList.add('is-settled');
    const revealReelColor = () => {
      reelVideoEl.classList.add('is-ready');
      reelVideoEl.addEventListener('transitionend', (e) => {
        if (e.propertyName === 'filter') settleReelColor();
      });
      setTimeout(settleReelColor, 2000);
    };
    if (reelVideoEl.readyState >= 2) { // HAVE_CURRENT_DATA — a frame is already available
      revealReelColor();
    } else {
      reelVideoEl.addEventListener('loadeddata', revealReelColor, { once: true });
      reelVideoEl.addEventListener('error', revealReelColor, { once: true });
    }
  }

  // Mute/unmute button overlaid on the reel. Starts muted (required for autoplay to
  // work in every browser); clicking just flips the video's own .muted property and
  // swaps which SVG icon is shown.
  const reelVideo = document.getElementById('reel-video');
  const soundBtn = document.getElementById('sound-toggle');
  const iconMuted = document.getElementById('icon-muted');
  const iconUnmuted = document.getElementById('icon-unmuted');

  // Pauses the reel while the hero is off screen, and picks it back up when it returns
  // (Sept 2026).
  //
  // A muted autoplaying video keeps playing when it's scrolled out of view, and this one
  // is 1080p 10-bit AV1: measured on the live site, it went on advancing a full second per
  // second behind the work grid. Chrome decodes AV1 in software on Macs without a
  // hardware AV1 decoder (every M1 and M2), so browsing the grid meant scrolling on top of
  // a video decode nobody could see. Paused, it also stops pulling bytes it doesn't need.
  //
  // Only while muted. With the sound on, the visitor is watching — or listening while they
  // browse — and pausing would cut them off. Never in fullscreen either, where the page's
  // own layout says nothing about whether the video is visible.
  let reelOnScreen = true;
  function reelIsFullscreen() {
    return document.fullscreenElement === reelVideo || (reelVideo && reelVideo.webkitDisplayingFullscreen);
  }
  const heroSection = document.querySelector('.hero');
  if (reelVideo && heroSection && 'IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      reelOnScreen = entries[entries.length - 1].isIntersecting;
      if (reelOnScreen) {
        if (reelVideo.paused) reelVideo.play().catch(() => {});
      } else if (reelVideo.muted && !reelIsFullscreen()) {
        reelVideo.pause();
      }
    }).observe(heroSection);
  }

  // Explicit play() call, reinforcing the autoplay attribute rather than relying on it
  // alone — reported not autoplaying on mobile, Aug 2026. Re-setting .muted as a live
  // property (not just trusting the initial HTML attribute) matters here: some mobile
  // browsers check the current property value at the moment play() is actually called,
  // not just what was declared in markup. If the browser blocks it outright anyway
  // (e.g. iOS Low Power Mode overrides even a muted+playsinline video, and that can't
  // be worked around from JS), retry once on the very first touch or scroll — nearly
  // every mobile browser's autoplay restriction lifts after any user interaction with
  // the page, even one unrelated to the video itself.
  if (reelVideo) {
    reelVideo.muted = true;
    const playAttempt = reelVideo.play();
    if (playAttempt && playAttempt.catch) {
      playAttempt.catch(() => {
        const resumeOnInteraction = () => {
          if (reelOnScreen) reelVideo.play().catch(() => {}); // off screen, the observer above starts it on the way back
        };
        // touchstart/scroll cover the common cases; click and pointerdown are added so a
        // direct tap on the native "tap to play" icon Low Power Mode stamps on the poster
        // resolves on that same tap, not just a for a later scroll or unrelated touch.
        window.addEventListener('touchstart', resumeOnInteraction, { once: true, passive: true });
        window.addEventListener('scroll', resumeOnInteraction, { once: true, passive: true });
        window.addEventListener('click', resumeOnInteraction, { once: true, passive: true });
        window.addEventListener('pointerdown', resumeOnInteraction, { once: true, passive: true });
      });
    }
  }

  if (reelVideo && soundBtn) {
    soundBtn.addEventListener('click', () => {
      reelVideo.muted = !reelVideo.muted;
      syncSoundIcon();
    });
  }
  // Keeps the custom mute icon truthful — needed because the fullscreen native controls
  // (especially the iPhone player) let the viewer change mute/volume behind our back.
  function syncSoundIcon() {
    iconMuted.style.display = reelVideo.muted ? 'block' : 'none';
    iconUnmuted.style.display = reelVideo.muted ? 'none' : 'block';
  }

  // Fullscreen button next to the mute button. Standard requestFullscreen everywhere
  // except iPhone Safari, which only exposes webkitEnterFullscreen (opens the native
  // player, with its own controls and sound). The video keeps looping either way.
  const fsBtn = document.getElementById('fullscreen-toggle');
  if (reelVideo && fsBtn) {
    fsBtn.addEventListener('click', () => {
      if (reelVideo.requestFullscreen) reelVideo.requestFullscreen();
      else if (reelVideo.webkitEnterFullscreen) reelVideo.webkitEnterFullscreen();
    });
    // Back from fullscreen: the hero loop must always be playing, even if the viewer
    // paused it in there. Two exit events for the two fullscreen mechanisms:
    // fullscreenchange (standard) and webkitendfullscreen (iPhone native player).
    function onFullscreenExit() {
      syncSoundIcon();
      // Some browsers pause the video internally, once or more, during the fullscreen-exit
      // transition (this varies by browser and isn't limited to iOS Safari). Keep resuming
      // for a short window using both a 'pause' listener and a poll — relying on the event
      // alone isn't reliable across engines. tryPlay() swallows the benign "play() request
      // was interrupted by pause()" rejection some browsers throw when play/pause race.
      function tryPlay() {
        const p = reelVideo.play();
        if (p && p.catch) p.catch(() => {});
      }
      const guardUntil = Date.now() + 1500;
      function cleanup() {
        reelVideo.removeEventListener('pause', resumeGuard);
        clearInterval(pollId);
      }
      function resumeGuard() {
        if (Date.now() < guardUntil) tryPlay();
        else cleanup();
      }
      const pollId = setInterval(() => {
        if (Date.now() >= guardUntil) { cleanup(); return; }
        if (reelVideo.paused) tryPlay();
      }, 150);
      reelVideo.addEventListener('pause', resumeGuard);
      tryPlay();
      setTimeout(cleanup, 1500);
    }
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) onFullscreenExit();
    });
    reelVideo.addEventListener('webkitendfullscreen', onFullscreenExit);
  }

  // Work grid: fetched once from data/projects.json and cached, then rendered into
  // #work-grid. activeFilter holds a project type code (e.g. 'TV') to show only that
  // category, or null to show everything — set by clicking a button in the category
  // filter bar. Each card carries its type/title/credit/index in data-* attributes so the
  // shared #work-info-bar (desktop-only, see below) can read them straight off whichever
  // card is hovered without needing its own copy of the project list.
  let cachedProjects = null;
  let activeFilter = null;

  // Builds every card, once. Cards opt into the shared scroll reveal, so they lift into
  // place the first time they're reached — see observeReveals() in site.js.
  //
  // Once, and never again for the life of the page (Sept 2026). The filter and the
  // language toggle both used to call this, and both paid for it the same way: innerHTML
  // throws every card away, the replacements start at opacity 0, and the whole grid
  // blanked and lifted back in — including the cards that were on screen before and after
  // and hadn't changed at all. The filter now hides the cards that don't match
  // (applyFilter), the toggle relabels them in place (updateCardLabels), and each card
  // stays the same element from first render to last.
  function renderWorkGrid() {
    const grid = document.getElementById('work-grid');
    if (!grid || !cachedProjects) return;
    const isFr = body.classList.contains('lang-fr');
    grid.innerHTML = cachedProjects.map((p) => {
      const acronym = projectTypeAcronym(p.type, isFr);
      const creditName = p.artist || p.client || '';
      const credit = creditName ? `${creditName} · ${p.director || ''}` : (p.director || '');
      return `
      <a class="work-card" href="project.html?project=${encodeURIComponent(p.id)}"
         data-reveal
         data-type-code="${esc(p.type)}"
         data-type="${esc(acronym)}" data-title="${esc(p.title)}" data-credit="${esc(credit)}">
        <img class="thumb" src="assets/${esc(p.thumbnail)}" alt="${esc(p.title)}" loading="lazy" style="object-position:${esc(p.thumbnailFocus || '50% 50%')};">
        <div class="work-card-meta">
          <p class="type">${esc(acronym)}</p>
          ${p.artist || p.client ? `<p class="artist">${esc(p.artist || p.client)}</p>` : ''}
          <p class="title">${esc(p.title)}</p>
        </div>
      </a>
    `;
    }).join('');
    applyFilter();
    observeReveals(grid);
  }

  // Shows the cards matching activeFilter and hides the rest, then renumbers the visible
  // ones for the info bar's "06 / 32". A hidden card is display:none (see
  // .work-card[hidden] in style.css), so it takes no grid cell, no tab stop and no
  // IntersectionObserver entry until it comes back.
  function applyFilter() {
    const cards = document.querySelectorAll('#work-grid .work-card:not(.work-card-ghost)');
    let shown = 0;
    cards.forEach((card) => {
      const match = !activeFilter || card.dataset.typeCode === activeFilter;
      card.hidden = !match;
      if (match) card.dataset.index = String(++shown);
    });
    cards.forEach((card) => { card.dataset.total = String(shown); });
  }

  // Rewrites each card's type tag for the current language, on the existing elements.
  function updateCardLabels() {
    const isFr = body.classList.contains('lang-fr');
    document.querySelectorAll('#work-grid .work-card:not(.work-card-ghost)').forEach((card) => {
      const acronym = projectTypeAcronym(card.dataset.typeCode, isFr);
      card.dataset.type = acronym;
      const tag = card.querySelector('.type');
      if (tag) tag.textContent = acronym;
    });
  }

  // Shared bottom info bar (desktop/hover-capable only — hidden entirely on touch via
  // CSS, see .work-info-bar in style.css): replaces the old always-in-DOM per-card
  // caption on non-touch devices, showing whichever card is currently hovered/focused
  // instead. Wired once via event delegation on #work-grid. The bar itself
  // (background/border) always stays visible — only #info-bar-content fades in and out,
  // so the black strip along the bottom edge never flickers away between cards.
  //
  // The same delegation drives the hover dim (Sept 2026): .is-dimming on the grid and
  // .is-current on the card being looked at, instead of the pure-CSS :hover pair this
  // used to be. The CSS version couldn't tell "between two cards" from "off the grid":
  // crossing the 6px gap from one card to the next matched .work-grid:hover with no card
  // hovered, so every card dimmed for a frame or two and the info bar started fading out,
  // then both reversed. Here the current card only changes when the pointer reaches
  // another card, and everything clears only when it leaves the grid itself.
  const workGridEl = document.getElementById('work-grid');
  const infoBarContent = document.getElementById('info-bar-content');
  let currentCard = null;
  function updateWorkInfoBar(card) {
    if (currentCard && currentCard !== card) currentCard.classList.remove('is-current');
    currentCard = card;
    if (workGridEl) workGridEl.classList.toggle('is-dimming', !!card);
    if (!infoBarContent) return;
    if (!card) { infoBarContent.classList.remove('visible'); return; }
    card.classList.add('is-current');
    document.getElementById('info-bar-type').textContent = card.dataset.type || '';
    document.getElementById('info-bar-title').textContent = card.dataset.title || '';
    document.getElementById('info-bar-credit').textContent = card.dataset.credit || '';
    document.getElementById('info-bar-index').textContent = card.dataset.index.padStart(2, '0') + ' / ' + card.dataset.total;
    infoBarContent.classList.add('visible');
  }
  if (workGridEl) {
    // Mouse only: a touch or pen "hover" is the tap itself, and touch devices have no bar.
    workGridEl.addEventListener('pointerover', (e) => {
      if (e.pointerType !== 'mouse') return;
      const card = e.target.closest('.work-card');
      if (card && card !== currentCard) updateWorkInfoBar(card);
    });
    workGridEl.addEventListener('pointerleave', (e) => {
      if (e.pointerType === 'mouse') updateWorkInfoBar(null);
    });
    // Keyboard focus only. A mouse click focuses the link too, and would otherwise leave
    // the grid dimmed around that card when the visitor comes back to this page.
    workGridEl.addEventListener('focusin', (e) => {
      const card = e.target.closest('.work-card');
      if (card && card.matches(':focus-visible')) updateWorkInfoBar(card);
    });
    workGridEl.addEventListener('focusout', (e) => {
      const card = e.target.closest('.work-card');
      if (card && !workGridEl.contains(e.relatedTarget)) updateWorkInfoBar(null);
    });
  }

  // Slides the info bar between the positions a filter change moves it between.
  //
  // The bar sits at the bottom of #work and sticks to the viewport only while the
  // section runs past it, so filtering moves it a long way: 32 projects down to 8
  // shortens the section from ~1750px to ~520px and the bar unsticks to the section's
  // real bottom edge, a 685px jump in one frame at 1440x900.
  //
  // This is a FLIP — read where it is, apply the change, read where it landed, then put
  // it back at the old offset and animate that away. It has to be done in JS: no
  // property of the bar's own changed, it moved because the section above it got
  // shorter, and layout isn't something CSS can transition. A same-document View
  // Transition handled this for a while, since that API exists for exactly this problem,
  // but it also crossfades every snapshot it takes — the cards, and the whole page root
  // as #contact slid up underneath — and the crossfade is the one thing this shouldn't
  // do. Web Animations rather than a class toggle so there's no state to clean up: the
  // animation has no fill, so the bar is back to its own styles the moment it ends.
  // Timing comes from the same :root tokens as the rest of the site's motion.
  function withInfoBarSlide(applyChange) {
    const bar = document.getElementById('work-info-bar');
    // display:none on touch, where there is no bar on screen to move.
    if (!bar || prefersReducedMotion() || getComputedStyle(bar).display === 'none') {
      applyChange();
      return;
    }
    const before = bar.getBoundingClientRect().top;
    applyChange();
    // getBoundingClientRect() forces the pending layout, so this reads the post-change
    // position rather than a stale one.
    const delta = before - bar.getBoundingClientRect().top;
    if (!delta) return; // filtering to a list of the same height moves nothing
    const rootStyles = getComputedStyle(document.documentElement);
    bar.animate(
      [{ transform: `translateY(${delta}px)` }, { transform: 'translateY(0)' }],
      {
        duration: parseFloat(rootStyles.getPropertyValue('--dur-bar-travel')) || 220,
        easing: rootStyles.getPropertyValue('--ease-out-soft').trim() || 'ease-out'
      }
    );
  }

  // Animates a filter change on the cards themselves (Sept 2026), the same FLIP as the
  // info bar above: read where every on-screen card is, apply the change, read where each
  // landed, and play the difference back.
  //
  // Three kinds of card come out of one change, and each gets its own motion:
  //   - Stayed visible: slides from its old cell to its new one. Nothing about it fades,
  //     because nothing about it changed — it just moved.
  //   - Left: hidden cards take no layout, so they can't fade in place. A detached copy is
  //     left over the cell it occupied, fading and shrinking slightly while the survivors
  //     slide in under it, then removed. That lets the change happen on the click frame
  //     rather than after an exit animation has finished — the grid starts answering
  //     immediately.
  //   - Arrived on screen (newly shown, or moved up from below the fold): fades and
  //     settles in from 96% on a short stagger. It's claimed from the scroll reveal first
  //     (settleReveal() in site.js) so it doesn't also lift in a moment later.
  //
  // Only cards on screen before or after are animated; the rest simply take their places.
  // A click that lands mid-animation reads the cards where they visibly are and cancels
  // what was running, so rapid filter changes redirect smoothly rather than jumping.
  const gridAnimations = new WeakMap();
  function withGridFlip(applyChange) {
    const grid = document.getElementById('work-grid');
    if (!grid || prefersReducedMotion()) {
      applyChange();
      return;
    }
    const viewportH = window.innerHeight;
    const onScreen = (r) => r.bottom > 0 && r.top < viewportH && r.width > 0;
    const cards = Array.from(grid.querySelectorAll('.work-card:not(.work-card-ghost)'));

    const before = new Map();
    cards.forEach((card) => {
      if (card.hidden) return;
      const rect = card.getBoundingClientRect();
      if (onScreen(rect)) before.set(card, { rect, opacity: getComputedStyle(card).opacity });
    });
    cards.forEach((card) => {
      (gridAnimations.get(card) || []).forEach((a) => a.cancel());
      gridAnimations.delete(card);
    });
    grid.querySelectorAll('.work-card-ghost').forEach((ghost) => ghost.remove());

    applyChange();

    const rootStyles = getComputedStyle(document.documentElement);
    const easeOut = rootStyles.getPropertyValue('--ease-out').trim() || 'ease-out';
    const moveMs = parseFloat(rootStyles.getPropertyValue('--dur-grid-move')) || 360;
    const enterMs = parseFloat(rootStyles.getPropertyValue('--dur-ui')) || 320;
    const gridRect = grid.getBoundingClientRect();
    let entering = 0;

    cards.forEach((card) => {
      const old = before.get(card);
      if (card.hidden) {
        if (!old) return;
        const ghost = card.cloneNode(true);
        ghost.hidden = false;
        ghost.removeAttribute('href');
        ghost.removeAttribute('data-reveal');
        ghost.classList.remove('is-current');
        ghost.classList.add('work-card-ghost');
        ghost.setAttribute('aria-hidden', 'true');
        Object.assign(ghost.style, {
          left: (old.rect.left - gridRect.left) + 'px',
          top: (old.rect.top - gridRect.top) + 'px',
          width: old.rect.width + 'px',
          height: old.rect.height + 'px'
        });
        grid.appendChild(ghost);
        ghost.animate(
          [{ opacity: old.opacity, transform: 'none' }, { opacity: 0, transform: 'scale(0.96)' }],
          { duration: enterMs * 0.6, easing: easeOut, fill: 'forwards' }
        ).finished.then(() => ghost.remove(), () => {});
        return;
      }
      const rect = card.getBoundingClientRect();
      // A card that stayed visible animates if it was on screen before or is after, so
      // one pushed down past the fold slides out of view rather than vanishing.
      if (!old && !onScreen(rect)) return;
      let animation;
      if (old) {
        const dx = old.rect.left - rect.left;
        const dy = old.rect.top - rect.top;
        if (!dx && !dy) return;
        animation = card.animate(
          [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
          { duration: moveMs, easing: easeOut }
        );
      } else {
        // A card whose photo isn't ready yet is left to the scroll reveal, which waits for
        // the decode; fading in here would fade in an empty frame.
        const img = card.querySelector('img');
        const ready = card.classList.contains('is-revealed') || (img && img.complete && img.naturalWidth);
        if (!ready) return;
        settleReveal(card);
        animation = card.animate(
          [{ opacity: 0, transform: 'scale(0.96)' }, { opacity: 1, transform: 'none' }],
          { duration: enterMs, easing: easeOut, delay: 60 + entering++ * 20, fill: 'backwards' }
        );
      }
      gridAnimations.set(card, [animation]);
    });
  }

  // Returning to this page from the back/forward cache (Sept 2026 — the usual way back from
  // a project now, see initBackToGrid() in site.js). The page comes back exactly as it was
  // left, which includes two things that shouldn't survive the trip: the hover state of the
  // card that was clicked, with the rest of the grid still dimmed around it, and a reel the
  // browser paused on the way out.
  window.addEventListener('pageshow', (e) => {
    if (!e.persisted) return;
    updateWorkInfoBar(null);
    if (reelVideo && reelOnScreen && reelVideo.paused) reelVideo.play().catch(() => {});
  });

  // Resize handling is rAF-throttled to match the scroll listener's pattern above —
  // without this, sizeReel ran once per resize event with no limit, unlike the scroll
  // handler which is deliberately throttled. Aug 2026.
  let resizeTicking = false;
  function onResizeThrottled() {
    sizeReel();
    syncNavHeight();
    refreshHeroParallax(); // the hero's height is what the parallax measures against
    resizeTicking = false;
  }
  window.addEventListener('resize', () => {
    if (!resizeTicking) {
      requestAnimationFrame(onResizeThrottled);
      resizeTicking = true;
    }
  });

  // The one list of filter choices — "All"/"Tous" plus every entry in PROJECT_TYPES, in
  // the current language. Shared by the filter bar below and by the footer's category
  // links (Sept 2026), so the two rows can never offer a different set of options.
  //
  // Each item carries both the full label and the acronym the work cards already use
  // (AD/PUB, MV/CLIP...). The filter bar only ever renders `label`; the footer renders
  // both and lets CSS pick, so that row can shrink to fit a narrow phone without any
  // resize listener or re-render — see .contact-footer-nav in style.css. "All"/"Tous"
  // has no acronym and is short enough not to need one, so it is its own short form.
  function buildFilterItems(isFr) {
    const allLabel = STRINGS['work.filter_all'] ? (isFr ? STRINGS['work.filter_all'].fr : STRINGS['work.filter_all'].en) : 'All';
    return [{ code: null, label: allLabel, short: allLabel }].concat(
      Object.keys(PROJECT_TYPES).map((code) => ({
        code,
        label: projectTypeLabel(code, isFr),
        short: projectTypeAcronym(code, isFr)
      }))
    );
  }

  // Category filter bar: rendered from buildFilterItems() as a slash-separated list of
  // plain text buttons (no chip/pill styling) — rebuilt on language toggle since the
  // labels are bilingual. Clicking one sets activeFilter, moves the .active mark in place
  // and animates the grid into its filtered state; it doesn't refetch or rebuild anything.
  // The bar and the cards FLIP inside the same change, so both read one layout.
  function renderCategoryFilter() {
    const container = document.getElementById('category-filter');
    if (!container) return;
    const isFr = body.classList.contains('lang-fr');
    const items = buildFilterItems(isFr);
    container.innerHTML = items.map((item, i) => `
      <button type="button" data-filter="${esc(item.code || '')}" class="${activeFilter === item.code ? 'active' : ''}">${esc(item.label)}</button>
      ${i < items.length - 1 ? '<span class="filter-sep" aria-hidden="true">/</span>' : ''}
    `).join('');
    container.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = btn.dataset.filter || null;
        if (next === activeFilter) return;
        activeFilter = next;
        syncFilterButtons();
        withInfoBarSlide(() => withGridFlip(applyFilter));
      });
    });
  }

  function syncFilterButtons() {
    document.querySelectorAll('#category-filter button').forEach((btn) => {
      btn.classList.toggle('active', (btn.dataset.filter || null) === activeFilter);
    });
  }

  // Footer category links (Sept 2026): the same choices as the filter bar, but reached
  // from the bottom of the page, so they also have to scroll back up to #work — without
  // that, clicking one would silently re-render a grid the visitor can't see. No
  // withInfoBarSlide() here, unlike the filter bar: the bar is off-screen at the moment
  // of the click, so sliding it would animate where nobody is looking and only risk
  // fighting the scroll. The cards still reveal normally once the scroll arrives.
  function renderFooterNav() {
    const container = document.getElementById('contact-footer-nav');
    if (!container) return;
    const isFr = body.classList.contains('lang-fr');
    container.setAttribute('aria-label', isFr ? 'Projets par catégorie' : 'Projects by category');
    // Both forms are rendered; style.css shows exactly one. Kept on separate spans
    // rather than swapped in JS so nothing has to listen for resize or re-render when
    // the phone rotates.
    container.innerHTML = buildFilterItems(isFr).map((item) => `
      <button type="button" data-filter="${esc(item.code || '')}">
        <span class="cat-full">${esc(item.label)}</span><span class="cat-short">${esc(item.short)}</span>
      </button>
    `).join('');
    container.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.filter || null;
        syncFilterButtons(); // keeps the bar at the top showing the same active choice
        applyFilter();
        document.getElementById('work').scrollIntoView({ behavior: scrollBehavior(), block: 'start' });
      });
    });
  }

  // Honoured by the two scrolls this page triggers from a click (footer category links
  // and back-to-top). style.css's prefers-reduced-motion block can't reach these —
  // scroll-behavior isn't what's in play, scrollIntoView/scrollTo take it as an argument.
  function scrollBehavior() {
    return prefersReducedMotion() ? 'auto' : 'smooth';
  }

  document.getElementById('contact-year').textContent = new Date().getFullYear();
  document.getElementById('contact-top').addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: scrollBehavior() });
  });

  // i18n (all static bilingual copy + project type acronyms) and the project list are
  // independent fetches, loaded in parallel — applyStrings() needs the former, and
  // renderWorkGrid() needs both (project data plus the type acronyms i18n provides).
  Promise.all([
    loadI18n(),
    fetch('data/projects.json?v=135').then((r) => r.json())
  ])
    .then(([, data]) => {
      applyStrings();
      cachedProjects = data.projects;
      renderCategoryFilter();
      renderFooterNav();
      renderWorkGrid();
      scrollToHashTarget(); // grid just changed #work's height, which can shift #contact below it
    })
    .catch((err) => console.error('Impossible de charger les données:', err));

  // Contact section: photo, bio, email, location, availability, Instagram — editable in
  // the admin ("Coordonnées" panel) without touching this file, since they're pulled
  // from data/settings.json rather than hardcoded here. bioFr/bioEn went unrendered
  // between the Aug 2026 redesign and the Sept 2026 restructure (the admin kept saving
  // them throughout), and are back on the page now as .contact-bio.
  fetch('data/settings.json?v=135')
    .then((r) => r.json())
    .then((s) => {
      if (s.photoFilename) {
        document.getElementById('contact-photo').src = 'assets/' + s.photoFilename;
      }
      document.getElementById('contact-bio-fr').textContent = s.bioFr || '';
      document.getElementById('contact-bio-en').textContent = s.bioEn || '';
      const emailEl = document.getElementById('contact-email');
      document.getElementById('contact-email-text').textContent = s.email;
      emailEl.href = 'mailto:' + s.email;
      document.getElementById('contact-location-fr').textContent = s.locationFr;
      document.getElementById('contact-location-en').textContent = s.locationEn;
      document.getElementById('contact-availability-fr').textContent = s.availabilityFr;
      document.getElementById('contact-availability-en').textContent = s.availabilityEn;
      const igEl = document.getElementById('contact-instagram');
      document.getElementById('contact-instagram-text').textContent = '@' + s.instagramHandle;
      igEl.href = 'https://instagram.com/' + s.instagramHandle;
      scrollToHashTarget(); // contact copy just landed, in case its length shifted anything
    })
    .catch((err) => console.error('Impossible de charger les coordonnées:', err));

</script>
</body>
</html>
