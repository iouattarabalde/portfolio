<!-- Continuously cycles the accent color (Red -> Yellow -> Green -> Cyan -> Blue ->
     Magenta -> Red), one full loop every 60s, random starting point per page load —
     requested Aug 2026, replaces the earlier random-pick-of-3-fixed-colors version.

     This is the SECOND implementation. The first tried to do this entirely in CSS: an
     animated number (--accent-hue) fed live into oklch()'s hue argument, redesigned
     once already into --accent itself being a @property-registered <color> animated
     directly through literal color keyframes. Both versions were spec-valid CSS, and
     both broke .wordmark span's color in real browser testing anyway (it rendered
     solid white — --accent was becoming invalid and falling through to the inherited
     page text color). Animating a color-typed custom property through @property
     proved too inconsistently supported in practice to keep trusting, so this version
     drops CSS animation entirely: a requestAnimationFrame loop computes the exact
     oklch(65% 0.09 hue) -> sRGB hex color for the current moment in JS, roughly 8
     times a second (throttled inside the rAF loop itself — see UPDATE_INTERVAL_MS
     below; every single frame was ~8x more updates than perceptible for a 60s cycle,
     and each one triggers a style recalc everywhere --accent is used),
     and sets --accent directly via style.setProperty() — exactly the same mechanism
     the original static 3-color picker used with zero issues, just re-run
     continuously instead of once. The oklch->sRGB math and the 65%/0.09 L/C choice
     are the same ones verified earlier for contrast (worst case 5.46:1 against --bg
     across the full hue circle, comfortably clearing WCAG AA's 4.5:1).

     Also runs in admin/index.html (same script, own copy) since Aug 2026 — originally
     kept out of the admin so its accent stayed fixed at style.css's plain #8A9A5B
     default, but brought in to match once the cycling accent became the site's whole
     visual signature rather than an incidental homepage touch. -->
<script>
  (function () {
    var CYCLE_MS = 60000; // full 360° loop duration
    var L = 0.65, C = 0.09; // oklch lightness/chroma — perceptually uniform brightness across every hue, unlike hsl()
    var html = document.documentElement;
    var startOffset = Math.random() * CYCLE_MS; // randomizes where in the loop this page load begins

    function oklchToHex(hueDeg) {
      var h = hueDeg * Math.PI / 180;
      var a = C * Math.cos(h);
      var b = C * Math.sin(h);
      var l_ = L + 0.3963377774 * a + 0.2158037573 * b;
      var m_ = L - 0.1055613458 * a - 0.0638541728 * b;
      var s_ = L - 0.0894841775 * a - 1.2914855480 * b;
      var l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
      var r = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
      var g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
      var bl = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
      function toSrgb(c) {
        c = Math.max(0, Math.min(1, c));
        return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
      }
      function hex2(c) {
        var n = Math.round(toSrgb(c) * 255).toString(16);
        return n.length === 1 ? '0' + n : n;
      }
      return '#' + hex2(r) + hex2(g) + hex2(bl);
    }

    var UPDATE_INTERVAL_MS = 120; // ~8x/sec — imperceptibly different from every frame for a 60s cycle, but ~8x less work
    var lastUpdate = -Infinity;

    function tick(now) {
      if (now - lastUpdate >= UPDATE_INTERVAL_MS) {
        var elapsed = (now + startOffset) % CYCLE_MS;
        var hue = (elapsed / CYCLE_MS) * 360;
        html.style.setProperty('--accent', oklchToHex(hue));
        lastUpdate = now;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>

<!-- Hero: self-hosted reel (video/reel.mp4), sized/muted via the script at the bottom.

     preload="metadata", NOT "auto" — changed Aug 2026 after an audit. reel.mp4 is ~89MB;
     preload="auto" invites the browser to fetch as much of that as it can the moment the
     page loads, for every visitor, whether or not they ever watch it. Against GitHub
     Pages' ~100GB/month soft bandwidth ceiling that's roughly 1,100 homepage visits
     before the site risks being throttled. "metadata" fetches only the header, then the
     autoplay attribute + the explicit play() call below start a normal progressive
     download — playback still begins on its own, it just streams instead of racing to
     buffer the whole file up front. The poster (assets/hero-poster.jpg) is what actually
     fills the frame on first paint either way, so there's nothing visible to lose here.
     fetchpriority="high" is dropped for the same reason: it was telling the browser to
     prioritize that download over the project thumbnails people actually scroll to. -->
<header class="hero">

<script>
  // ---------------------------------------------------------------
  // index.html script overview:
  //   1. Language toggle (FR/EN), persisted in localStorage
  //   2. Hero reel sizing (fills viewport below nav) + mute/unmute button
  //   3. Work grid, rendered from data/projects.json once data/strings.json (i18n.js)
  //      has also loaded, since card captions need the type acronyms it provides.
  //      Re-rendered on language change so those acronyms switch too.
  // ---------------------------------------------------------------

  const btn = document.getElementById('lang-toggle');
  const body = document.body;
  const stored = localStorage.getItem('iob-lang');
  if (stored === 'fr') body.classList.add('lang-fr'); // English is the default; only opt into French if remembered
  function updateLangButton() {
    // Button always shows the language you'd switch TO, not the current one
    btn.textContent = body.classList.contains('lang-fr') ? 'EN' : 'FR';
  }
  updateLangButton();
  btn.addEventListener('click', () => {
    body.classList.toggle('lang-fr');
    localStorage.setItem('iob-lang', body.classList.contains('lang-fr') ? 'fr' : 'en');
    document.documentElement.lang = body.classList.contains('lang-fr') ? 'fr' : 'en';
    updateLangButton();
    renderCategoryFilter(); // re-render so filter labels switch language too
    renderWorkGrid(); // re-render so card type tags (AD/PUB, MV/CLIP, etc.) switch language too
  });

  // Sizes the reel so it exactly fills the space below the sticky nav, fully visible
  // without scrolling on load. Math: available vertical space = viewport height minus
  // nav height minus the hero's own padding. Since the reel is 16:9, we convert that
  // available height into the matching width (height * 16/9) and cap the frame's
  // max-width there — the CSS aspect-ratio box then derives the height from that width.
  function sizeReel() {
    const nav = document.querySelector('.site-nav');
    const hero = document.querySelector('.hero');
    const frame = document.querySelector('.reel-frame');
    if (!nav || !hero || !frame) return;
    const navH = nav.offsetHeight;
    const heroStyles = getComputedStyle(hero);
    const heroPadV = parseFloat(heroStyles.paddingTop) + parseFloat(heroStyles.paddingBottom);
    const available = window.innerHeight - navH - heroPadV - 4; // 4px = small safety margin
    const maxWidthFromHeight = available * (16 / 9);
    frame.style.maxWidth = Math.max(280, maxWidthFromHeight) + 'px'; // 280px floor so it never gets absurdly small
  }
  // Called synchronously here (not just on 'load') so the frame is sized correctly
  // from the very first paint. It previously only ran on window.load, which waits for
  // every resource on the page — including the video itself, then still preload="auto" — to
  // finish, so the reel visibly rendered at the CSS fallback size (max-width: 1400px)
  // first and then snapped to its real computed size once 'load' finally fired. Safe
  // to call this early: it only reads the nav's offsetHeight and the hero's computed
  // padding, both already resolved once the elements exist in the DOM, and doesn't
  // depend on video/image/font loading at all. Aug 2026.
  sizeReel();
  window.addEventListener('load', () => { sizeReel(); scrollToHashTarget(); });

  // Fragment-scroll fix, Aug 2026: the browser's native anchor scroll (on initial
  // navigation to index.html#work or #contact, e.g. from project.html's nav or "Back
  // to Projects" link) fires before sizeReel(), the work-grid fetch, and the contact
  // fetch finish resizing the page below the hero — so the native scroll lands on a
  // layout that's about to shift, and the final position drifts with network timing.
  // We re-run the scroll manually from every call site that can move #work or
  // #contact, once each has settled. Idempotent and cheap, so calling it more than
  // once (in case two finish close together) is harmless — the last call wins.
  function scrollToHashTarget() {
    if (!location.hash) return;
    const target = document.querySelector(location.hash);
    if (target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  // Hero reel parallax: subtly scales down as you scroll past it, requested Aug 2026.
  // Direct scroll-value-following via a CSS custom property — same technique the
  // earlier nav-fade-on-scroll experiment used, before that was reverted for unrelated
  // visual reasons, not technical ones (the pattern itself worked fine). Not an
  // IntersectionObserver+CSS-transition combo like the removed .reveal, so none of
  // that class of bug applies here: there's no "before" state that needs to be painted
  // first, just a value continuously following the current scroll position every
  // frame. rAF-throttled, matching the resize listener below. Skips registering the
  // listener at all for prefers-reduced-motion, rather than relying only on the CSS
  // override to make it inert.
  const reelFrameEl = document.querySelector('.reel-frame');
  if (reelFrameEl && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const HERO_PARALLAX_DISTANCE = 600; // px of scroll over which the effect completes
    let parallaxTicking = false;
    function updateHeroParallax() {
      const progress = Math.min(Math.max(window.scrollY / HERO_PARALLAX_DISTANCE, 0), 1);
      const scale = 1 - progress * 0.05; // scales down to 95% by the time you've scrolled past
      reelFrameEl.style.setProperty('--parallax-scale', scale.toFixed(4));
      parallaxTicking = false;
    }
    window.addEventListener('scroll', () => {
      if (!parallaxTicking) {
        requestAnimationFrame(updateHeroParallax);
        parallaxTicking = true;
      }
    }, { passive: true });
    updateHeroParallax(); // sets the correct value immediately (e.g. reloading mid-scroll)
  }

  // Freeze-frame color reveal: the poster (and any video frame) renders desaturated
  // via CSS until the reel has enough data to actually play, then eases into full
  // color — see #reel-video / #reel-video.is-ready in style.css. 'loadeddata' is the
  // right signal here (not 'canplay'/'canplaythrough'): it's the earliest point a real
  // frame exists, matching "starts B&W, gains color as the video loads" rather than
  // waiting for enough buffer to guarantee uninterrupted playback. readyState check
  // covers the case the video already has a frame by the time this listener attaches
  // (e.g. a fast cache hit) — 'loadeddata' wouldn't fire again for it. The 'error'
  // fallback keeps a failed load from leaving the poster stuck grayscale forever.
  // Aug 2026.
  const reelVideoEl = document.getElementById('reel-video');
  if (reelVideoEl) {
    const revealReelColor = () => reelVideoEl.classList.add('is-ready');
    if (reelVideoEl.readyState >= 2) { // HAVE_CURRENT_DATA — a frame is already available
      revealReelColor();
    } else {
      reelVideoEl.addEventListener('loadeddata', revealReelColor, { once: true });
      reelVideoEl.addEventListener('error', revealReelColor, { once: true });
    }
  }

  // Mute/unmute button overlaid on the reel. Starts muted (required for autoplay to
  // work in every browser); clicking just flips the video's own .muted property and
  // swaps which SVG icon is shown.
  const reelVideo = document.getElementById('reel-video');
  const soundBtn = document.getElementById('sound-toggle');
  const iconMuted = document.getElementById('icon-muted');
  const iconUnmuted = document.getElementById('icon-unmuted');

  // Explicit play() call, reinforcing the autoplay attribute rather than relying on it
  // alone — reported not autoplaying on mobile, Aug 2026. Re-setting .muted as a live
  // property (not just trusting the initial HTML attribute) matters here: some mobile
  // browsers check the current property value at the moment play() is actually called,
  // not just what was declared in markup. If the browser blocks it outright anyway
  // (e.g. iOS Low Power Mode overrides even a muted+playsinline video, and that can't
  // be worked around from JS), retry once on the very first touch or scroll — nearly
  // every mobile browser's autoplay restriction lifts after any user interaction with
  // the page, even one unrelated to the video itself.
  if (reelVideo) {
    reelVideo.muted = true;
    const playAttempt = reelVideo.play();
    if (playAttempt && playAttempt.catch) {
      playAttempt.catch(() => {
        const resumeOnInteraction = () => {
          reelVideo.play().catch(() => {});
        };
        // touchstart/scroll cover the common cases; click and pointerdown are added so a
        // direct tap on the native "tap to play" icon Low Power Mode stamps on the poster
        // resolves on that same tap, not just a for a later scroll or unrelated touch.
        window.addEventListener('touchstart', resumeOnInteraction, { once: true, passive: true });
        window.addEventListener('scroll', resumeOnInteraction, { once: true, passive: true });
        window.addEventListener('click', resumeOnInteraction, { once: true, passive: true });
        window.addEventListener('pointerdown', resumeOnInteraction, { once: true, passive: true });
      });
    }
  }

  if (reelVideo && soundBtn) {
    soundBtn.addEventListener('click', () => {
      reelVideo.muted = !reelVideo.muted;
      syncSoundIcon();
    });
  }
  // Keeps the custom mute icon truthful — needed because the fullscreen native controls
  // (especially the iPhone player) let the viewer change mute/volume behind our back.
  function syncSoundIcon() {
    iconMuted.style.display = reelVideo.muted ? 'block' : 'none';
    iconUnmuted.style.display = reelVideo.muted ? 'none' : 'block';
  }

  // Fullscreen button next to the mute button. Standard requestFullscreen everywhere
  // except iPhone Safari, which only exposes webkitEnterFullscreen (opens the native
  // player, with its own controls and sound). The video keeps looping either way.
  const fsBtn = document.getElementById('fullscreen-toggle');
  if (reelVideo && fsBtn) {
    fsBtn.addEventListener('click', () => {
      if (reelVideo.requestFullscreen) reelVideo.requestFullscreen();
      else if (reelVideo.webkitEnterFullscreen) reelVideo.webkitEnterFullscreen();
    });
    // Back from fullscreen: the hero loop must always be playing, even if the viewer
    // paused it in there. Two exit events for the two fullscreen mechanisms:
    // fullscreenchange (standard) and webkitendfullscreen (iPhone native player).
    function onFullscreenExit() {
      syncSoundIcon();
      // Some browsers pause the video internally, once or more, during the fullscreen-exit
      // transition (this varies by browser and isn't limited to iOS Safari). Keep resuming
      // for a short window using both a 'pause' listener and a poll — relying on the event
      // alone isn't reliable across engines. tryPlay() swallows the benign "play() request
      // was interrupted by pause()" rejection some browsers throw when play/pause race.
      function tryPlay() {
        const p = reelVideo.play();
        if (p && p.catch) p.catch(() => {});
      }
      const guardUntil = Date.now() + 1500;
      function cleanup() {
        reelVideo.removeEventListener('pause', resumeGuard);
        clearInterval(pollId);
      }
      function resumeGuard() {
        if (Date.now() < guardUntil) tryPlay();
        else cleanup();
      }
      const pollId = setInterval(() => {
        if (Date.now() >= guardUntil) { cleanup(); return; }
        if (reelVideo.paused) tryPlay();
      }, 150);
      reelVideo.addEventListener('pause', resumeGuard);
      tryPlay();
      setTimeout(cleanup, 1500);
    }
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) onFullscreenExit();
    });
    reelVideo.addEventListener('webkitendfullscreen', onFullscreenExit);
  }

  // Work grid: fetched once from data/projects.json and cached, then rendered into
  // #work-grid. Re-render (renderWorkGrid) is called again on language toggle above,
  // which is why the fetched list is cached in a variable instead of only used once.
  // activeFilter holds a project type code (e.g. 'TV') to show only that category, or
  // null to show everything — set by clicking a button in the category filter bar.
  // Each card carries its type/title/credit/index in data-* attributes so the shared
  // #work-info-bar (desktop-only, see below) can read them straight off whichever card
  // is hovered without needing its own copy of the project list.
  let cachedProjects = null;
  let activeFilter = null;

  // Escapes a value before it's interpolated into generated HTML below. Titles, client
  // and crew names come from data/projects.json (written by the admin), so they're
  // ordinary human text, not hostile input — but they're still not HTML. Four DP/director
  // fields already contain "&" ("Sandra Coppola & Juliette Gosselin" and friends), and a
  // straight double quote in any title would end the attribute early and corrupt the rest
  // of the card's markup. Added Aug 2026 after an audit found every one of these
  // interpolations raw. Duplicated in project.html for the same reason withViewTransition
  // is — both belong in a shared script whenever the page JS gets consolidated.
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderWorkGrid() {
    const grid = document.getElementById('work-grid');
    if (!grid || !cachedProjects) return;
    const isFr = body.classList.contains('lang-fr');
    const visible = activeFilter ? cachedProjects.filter((p) => p.type === activeFilter) : cachedProjects;
    grid.innerHTML = visible.map((p, i) => {
      const acronym = projectTypeAcronym(p.type, isFr);
      const creditName = p.artist || p.client || '';
      const credit = creditName ? `${creditName} · ${p.director || ''}` : (p.director || '');
      return `
      <a class="work-card" href="project.html?project=${encodeURIComponent(p.id)}"
         data-index="${i + 1}" data-total="${visible.length}"
         data-type="${esc(acronym)}" data-title="${esc(p.title)}" data-credit="${esc(credit)}">
        <img class="thumb" src="assets/${esc(p.thumbnail)}" alt="${esc(p.title)}" loading="lazy" style="object-position:${esc(p.thumbnailFocus || '50% 50%')};">
        <div class="work-card-meta">
          <p class="type">${esc(acronym)}</p>
          ${p.artist || p.client ? `<p class="artist">${esc(p.artist || p.client)}</p>` : ''}
          <p class="title">${esc(p.title)}</p>
        </div>
      </a>
    `;
    }).join('');
  }

  // Shared bottom info bar (desktop/hover-capable only — hidden entirely on touch via
  // CSS, see .work-info-bar in style.css): replaces the old always-in-DOM per-card
  // caption on non-touch devices, showing whichever card is currently hovered/focused
  // instead. Wired once via event delegation on #work-grid, so it survives every
  // re-render (filter change, language toggle) without needing to be rewired. The bar
  // itself (background/border) always stays visible — only #info-bar-content fades in
  // and out, so the black strip along the bottom edge never flickers away between cards.
  const workGridEl = document.getElementById('work-grid');
  const infoBarContent = document.getElementById('info-bar-content');
  function updateWorkInfoBar(card) {
    if (!infoBarContent) return;
    if (!card) { infoBarContent.classList.remove('visible'); return; }
    document.getElementById('info-bar-type').textContent = card.dataset.type || '';
    document.getElementById('info-bar-title').textContent = card.dataset.title || '';
    document.getElementById('info-bar-credit').textContent = card.dataset.credit || '';
    document.getElementById('info-bar-index').textContent = card.dataset.index.padStart(2, '0') + ' / ' + card.dataset.total;
    infoBarContent.classList.add('visible');
  }
  if (workGridEl) {
    workGridEl.addEventListener('mouseover', (e) => {
      const card = e.target.closest('.work-card');
      if (card) updateWorkInfoBar(card);
    });
    workGridEl.addEventListener('mouseout', (e) => {
      const card = e.target.closest('.work-card');
      if (card && !card.contains(e.relatedTarget)) updateWorkInfoBar(null);
    });
    workGridEl.addEventListener('focusin', (e) => {
      const card = e.target.closest('.work-card');
      if (card) updateWorkInfoBar(card);
    });
    workGridEl.addEventListener('focusout', (e) => {
      const card = e.target.closest('.work-card');
      if (card && !card.contains(e.relatedTarget)) updateWorkInfoBar(null);
    });
  }

  // Resize handling is rAF-throttled to match the scroll listener's pattern above —
  // without this, sizeReel ran once per resize event with no limit, unlike the scroll
  // handler which is deliberately throttled. Aug 2026.
  let resizeTicking = false;
  function onResizeThrottled() {
    sizeReel();
    resizeTicking = false;
  }
  window.addEventListener('resize', () => {
    if (!resizeTicking) {
      requestAnimationFrame(onResizeThrottled);
      resizeTicking = true;
    }
  });

  // Runs updateFn as a same-document View Transition when supported, otherwise just
  // runs it directly — used for the work-grid filter crossfade below, and the same
  // helper (duplicated) drives the lightbox's still-to-still crossfade in project.html.
  // Temporarily adds .same-doc-transition to <body> for the duration; see the CSS rule
  // of the same name in style.css for why (excludes the nav from its own
  // view-transition-name, which otherwise renders it above everything else during the
  // transition regardless of normal z-index — the bug that first showed up in the
  // lightbox crossfade, generalized into this shared helper so it doesn't need
  // re-solving for every new same-document transition). Aug 2026.
  function withViewTransition(updateFn) {
    if (!document.startViewTransition) {
      updateFn();
      return;
    }
    document.body.classList.add('same-doc-transition');
    const transition = document.startViewTransition(updateFn);
    transition.finished.finally(() => {
      document.body.classList.remove('same-doc-transition');
    });
  }

  // Category filter bar: one entry per PROJECT_TYPES (from i18n.js), plus an "All"/"Tous"
  // entry to clear the filter, rendered as a slash-separated list of plain text buttons
  // (no chip/pill styling) — rebuilt on language toggle since the labels are bilingual.
  // Clicking one just sets activeFilter and re-renders the grid; it doesn't refetch
  // anything, filtering happens against the already-cached project list.
  function renderCategoryFilter() {
    const container = document.getElementById('category-filter');
    if (!container) return;
    const isFr = body.classList.contains('lang-fr');
    const allLabel = STRINGS['work.filter_all'] ? (isFr ? STRINGS['work.filter_all'].fr : STRINGS['work.filter_all'].en) : 'All';
    const items = [{ code: null, label: allLabel }].concat(
      Object.keys(PROJECT_TYPES).map((code) => ({ code, label: projectTypeLabel(code, isFr) }))
    );
    container.innerHTML = items.map((item, i) => `
      <button type="button" data-filter="${esc(item.code || '')}" class="${activeFilter === item.code ? 'active' : ''}">${esc(item.label)}</button>
      ${i < items.length - 1 ? '<span class="filter-sep" aria-hidden="true">/</span>' : ''}
    `).join('');
    container.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.filter || null;
        renderCategoryFilter();
        withViewTransition(() => {
          renderWorkGrid();
        });
      });
    });
  }

  // i18n (all static bilingual copy + project type acronyms) and the project list are
  // independent fetches, loaded in parallel — applyStrings() needs the former, and
  // renderWorkGrid() needs both (project data plus the type acronyms i18n provides).
  Promise.all([
    loadI18n(),
    fetch('data/projects.json').then((r) => r.json())
  ])
    .then(([, data]) => {
      applyStrings();
      cachedProjects = data.projects;
      renderCategoryFilter();
      renderWorkGrid();
      scrollToHashTarget(); // grid just changed #work's height, which can shift #contact below it
    })
    .catch((err) => console.error('Impossible de charger les données:', err));

  // Contact section: photo, email, location, availability, Instagram — editable in the
  // admin ("Coordonnées" panel) without touching this file, since they're pulled from
  // data/settings.json rather than hardcoded here. bioFr/bioEn are still saved by the
  // admin but no longer rendered on the site (design decision, Aug 2026) — the fields
  // stay in data/settings.json untouched, just unused here.
  fetch('data/settings.json')
    .then((r) => r.json())
    .then((s) => {
      if (s.photoFilename) {
        document.getElementById('contact-photo').src = 'assets/' + s.photoFilename;
      }
      const emailEl = document.getElementById('contact-email');
      document.getElementById('contact-email-text').textContent = s.email;
      emailEl.href = 'mailto:' + s.email;
      document.getElementById('contact-location-fr').textContent = s.locationFr;
      document.getElementById('contact-location-en').textContent = s.locationEn;
      document.getElementById('contact-availability-fr').textContent = s.availabilityFr;
      document.getElementById('contact-availability-en').textContent = s.availabilityEn;
      const igEl = document.getElementById('contact-instagram');
      document.getElementById('contact-instagram-text').textContent = '@' + s.instagramHandle;
      igEl.href = 'https://instagram.com/' + s.instagramHandle;
      scrollToHashTarget(); // contact copy just landed, in case its length shifted anything
    })
    .catch((err) => console.error('Impossible de charger les coordonnées:', err));

  // Halo/grain/background settings — editable in the admin (Design tab, sliders +
  // color picker). Independent fetch, applied on top of the CSS defaults in :root
  // (which already match this file's own defaults exactly), so a missing or
  // not-yet-created data/design.json just silently keeps the CSS defaults — never
  // breaks the page. Aug 2026.
  fetch('data/design.json')
    .then((r) => r.json())
    .then((d) => {
      const root = document.documentElement.style;
      if (d.haloIntensity != null) root.setProperty('--halo-intensity', d.haloIntensity);
      if (d.haloSize != null) root.setProperty('--halo-size', d.haloSize);
      if (d.haloFalloff != null) root.setProperty('--halo-falloff', d.haloFalloff);
      if (d.grainLevel != null) root.setProperty('--grain-level', d.grainLevel);
      if (d.bg) root.setProperty('--bg', d.bg);
    })
    .catch(() => {}); // file may not exist yet (first use, before any admin save) — fine, CSS defaults already match
</script>
</body>
</html>
