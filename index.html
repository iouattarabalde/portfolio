<!DOCTYPE html>
<!--
  index.html — homepage: hero reel, work grid (built from data/projects.json), contact info.
  Nav labels: "Projects" -> #work, "Contact" -> #contact.
  style.css is versioned (?v=N) as a cache-buster; bump the number on every CSS edit
  across ALL pages that link it, or browsers may keep serving a stale stylesheet.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ismael OB — Colorist</title>
<meta name="description" content="Ismael OB, colorist based in Montreal. Color grading for commercials, music videos, film and television.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<!-- Social sharing card (Open Graph + Twitter). og-image.jpg is a 1200x630 crop of a
     project still; swap the file in assets/ to change what shows up when the URL is
     shared on iMessage, LinkedIn, Slack, etc. URLs must be absolute for crawlers. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://ismaelob.com/">
<meta property="og:title" content="Ismael OB — Colorist">
<meta property="og:description" content="Color grading for commercials, music videos, film and television. Based in Montreal, available remote.">
<meta property="og:image" content="https://ismaelob.com/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_CA">
<meta property="og:locale:alternate" content="fr_CA">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=72">
<!-- Continuously cycles the accent color (Red -> Yellow -> Green -> Cyan -> Blue ->
     Magenta -> Red), one full loop every 60s, random starting point per page load —
     requested Aug 2026, replaces the earlier random-pick-of-3-fixed-colors version.

     This is the SECOND implementation. The first tried to do this entirely in CSS: an
     animated number (--accent-hue) fed live into oklch()'s hue argument, redesigned
     once already into --accent itself being a @property-registered <color> animated
     directly through literal color keyframes. Both versions were spec-valid CSS, and
     both broke .wordmark span's color in real browser testing anyway (it rendered
     solid white — --accent was becoming invalid and falling through to the inherited
     page text color). Animating a color-typed custom property through @property
     proved too inconsistently supported in practice to keep trusting, so this version
     drops CSS animation entirely: a requestAnimationFrame loop computes the exact
     oklch(65% 0.09 hue) -> sRGB hex color for the current moment in JS, every frame,
     and sets --accent directly via style.setProperty() — exactly the same mechanism
     the original static 3-color picker used with zero issues, just re-run
     continuously instead of once. The oklch->sRGB math and the 65%/0.09 L/C choice
     are the same ones verified earlier for contrast (worst case 5.46:1 against --bg
     across the full hue circle, comfortably clearing WCAG AA's 4.5:1).

     Only on the public pages (index.html, project.html) — deliberately not touched in
     admin/index.html, so the admin panel's own accent stays fixed at style.css's plain
     #8A9A5B default. -->
<script>
  (function () {
    var CYCLE_MS = 60000; // full 360° loop duration
    var L = 0.65, C = 0.09; // oklch lightness/chroma — perceptually uniform brightness across every hue, unlike hsl()
    var html = document.documentElement;
    var startOffset = Math.random() * CYCLE_MS; // randomizes where in the loop this page load begins

    function oklchToHex(hueDeg) {
      var h = hueDeg * Math.PI / 180;
      var a = C * Math.cos(h);
      var b = C * Math.sin(h);
      var l_ = L + 0.3963377774 * a + 0.2158037573 * b;
      var m_ = L - 0.1055613458 * a - 0.0638541728 * b;
      var s_ = L - 0.0894841775 * a - 1.2914855480 * b;
      var l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
      var r = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
      var g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
      var bl = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
      function toSrgb(c) {
        c = Math.max(0, Math.min(1, c));
        return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
      }
      function hex2(c) {
        var n = Math.round(toSrgb(c) * 255).toString(16);
        return n.length === 1 ? '0' + n : n;
      }
      return '#' + hex2(r) + hex2(g) + hex2(bl);
    }

    function tick(now) {
      var elapsed = (now + startOffset) % CYCLE_MS;
      var hue = (elapsed / CYCLE_MS) * 360;
      html.style.setProperty('--accent', oklchToHex(hue));
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
<script src="i18n.js"></script>
</head>
<body>

<nav class="site-nav">
  <div class="brand">
    <a href="index.html" class="wordmark">ISMAEL<span>OB</span></a>
    <span class="nav-eyebrow"><span data-fr data-key="nav.eyebrow"></span><span data-en data-key="nav.eyebrow"></span></span>
  </div>
  <div class="nav-links">
    <a href="#work"><span data-fr data-key="nav.work"></span><span data-en data-key="nav.work"></span></a>
    <a href="#contact"><span data-fr data-key="nav.contact"></span><span data-en data-key="nav.contact"></span></a>
    <button id="lang-toggle" type="button" aria-label="Toggle language">FR</button>
  </div>
</nav>

<!-- Hero: self-hosted reel (video/reel.mp4), sized/muted via the script at the bottom -->
<header class="hero">
  <h1 class="sr-only">
    <span data-fr>Ismael OB — Coloriste basé à Montréal</span>
    <span data-en>Ismael OB — Colorist based in Montreal</span>
  </h1>
  <div class="reel-frame">
    <div class="reel-embed">
      <video id="reel-video" autoplay muted loop playsinline preload="auto" title="Ismael OB - Demo Reel" disableRemotePlayback disablePictureInPicture>
        <!-- Same 1080p resolution both files, lower bitrate on mobile to keep the
             autoplay download reasonable on cellular (~40MB vs ~84MB). The browser
             picks a source once at load based on viewport width at that moment — it
             won't swap mid-session on resize/rotate, which matches how every other
             responsive choice on this site behaves. Breakpoint matches the site's most
             common mobile breakpoint (700px, see style.css). -->
        <source src="video/reel-mobile.mp4" type="video/mp4" media="(max-width: 700px)">
        <source src="video/reel.mp4" type="video/mp4">
      </video>
      <button id="fullscreen-toggle" type="button" aria-label="Fullscreen">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 9V4H9M15 4H20V9M20 15V20H15M9 20H4V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="sound-toggle" type="button" aria-label="Toggle sound">
        <svg id="icon-muted" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9V15H7L12 20V4L7 9H3Z" fill="currentColor"/>
          <path d="M16 8L21 16M21 8L16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg id="icon-unmuted" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none;">
          <path d="M3 9V15H7L12 20V4L7 9H3Z" fill="currentColor"/>
          <path d="M16 8.5C17 9.5 17.5 10.7 17.5 12C17.5 13.3 17 14.5 16 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M18.5 6C20.2 7.7 21 9.8 21 12C21 14.2 20.2 16.3 18.5 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="halo-dither" aria-hidden="true"></div>
</header>

<!-- Work grid: empty on load, filled by renderWorkGrid() from data/projects.json -->
<section id="work">
  <div class="section-head">
    <h2><span data-fr data-key="work.heading"></span><span data-en data-key="work.heading"></span></h2>
    <div class="category-filter" id="category-filter"></div>
  </div>

  <div class="work-grid" id="work-grid"></div>
</section>

<section class="contact" id="contact">
  <div class="bottom-glow" aria-hidden="true">
    <div class="bottom-glow-noise"></div>
    <div class="bottom-glow-gradient"></div>
  </div>
  <div class="contact-columns">
    <img id="contact-photo" class="contact-photo" src="" alt="Ismael OB">
    <div class="contact-right">
      <h2 class="contact-title">
        <span data-fr data-key="contact.heading"></span>
        <span data-en data-key="contact.heading"></span>
      </h2>
      <p class="contact-bio">
        <span data-fr id="contact-bio-fr"></span>
        <span data-en id="contact-bio-en"></span>
      </p>
      <dl class="contact-info">
        <div>
          <dt><span data-fr data-key="contact.email_label"></span><span data-en data-key="contact.email_label"></span></dt>
          <dd><a id="contact-email" href="#" target="_blank" rel="noopener"></a></dd>
        </div>
        <div>
          <dt><span data-fr data-key="contact.location_label"></span><span data-en data-key="contact.location_label"></span></dt>
          <dd><span data-fr id="contact-location-fr"></span><span data-en id="contact-location-en"></span><br><span data-fr id="contact-availability-fr"></span><span data-en id="contact-availability-en"></span></dd>
        </div>
        <div>
          <dt>Instagram</dt>
          <dd><a id="contact-instagram" href="#" target="_blank" rel="noopener"></a></dd>
        </div>
      </dl>
    </div>
  </div>
</section>


<script>
  // ---------------------------------------------------------------
  // index.html script overview:
  //   1. Language toggle (FR/EN), persisted in localStorage
  //   2. Hero reel sizing (fills viewport below nav) + mute/unmute button
  //   3. Work grid, rendered from data/projects.json once data/strings.json (i18n.js)
  //      has also loaded, since card captions need the type acronyms it provides.
  //      Re-rendered on language change so those acronyms switch too.
  // ---------------------------------------------------------------

  const btn = document.getElementById('lang-toggle');
  const body = document.body;
  const stored = localStorage.getItem('iob-lang');
  if (stored === 'fr') body.classList.add('lang-fr'); // English is the default; only opt into French if remembered
  function updateLangButton() {
    // Button always shows the language you'd switch TO, not the current one
    btn.textContent = body.classList.contains('lang-fr') ? 'EN' : 'FR';
  }
  updateLangButton();
  btn.addEventListener('click', () => {
    body.classList.toggle('lang-fr');
    localStorage.setItem('iob-lang', body.classList.contains('lang-fr') ? 'fr' : 'en');
    document.documentElement.lang = body.classList.contains('lang-fr') ? 'fr' : 'en';
    updateLangButton();
    renderCategoryFilter(); // re-render so filter labels switch language too
    renderWorkGrid(); // re-render so card type tags (AD/PUB, MV/CLIP, etc.) switch language too
  });

  // Sizes the reel so it exactly fills the space below the sticky nav, fully visible
  // without scrolling on load. Math: available vertical space = viewport height minus
  // nav height minus the hero's own padding. Since the reel is 16:9, we convert that
  // available height into the matching width (height * 16/9) and cap the frame's
  // max-width there — the CSS aspect-ratio box then derives the height from that width.
  function sizeReel() {
    const nav = document.querySelector('.site-nav');
    const hero = document.querySelector('.hero');
    const frame = document.querySelector('.reel-frame');
    if (!nav || !hero || !frame) return;
    const navH = nav.offsetHeight;
    const heroStyles = getComputedStyle(hero);
    const heroPadV = parseFloat(heroStyles.paddingTop) + parseFloat(heroStyles.paddingBottom);
    const available = window.innerHeight - navH - heroPadV - 4; // 4px = small safety margin
    const maxWidthFromHeight = available * (16 / 9);
    frame.style.maxWidth = Math.max(280, maxWidthFromHeight) + 'px'; // 280px floor so it never gets absurdly small
  }
  window.addEventListener('load', sizeReel);

  // Mute/unmute button overlaid on the reel. Starts muted (required for autoplay to
  // work in every browser); clicking just flips the video's own .muted property and
  // swaps which SVG icon is shown.
  const reelVideo = document.getElementById('reel-video');
  const soundBtn = document.getElementById('sound-toggle');
  const iconMuted = document.getElementById('icon-muted');
  const iconUnmuted = document.getElementById('icon-unmuted');
  if (reelVideo && soundBtn) {
    soundBtn.addEventListener('click', () => {
      reelVideo.muted = !reelVideo.muted;
      syncSoundIcon();
    });
  }
  // Keeps the custom mute icon truthful — needed because the fullscreen native controls
  // (especially the iPhone player) let the viewer change mute/volume behind our back.
  function syncSoundIcon() {
    iconMuted.style.display = reelVideo.muted ? 'block' : 'none';
    iconUnmuted.style.display = reelVideo.muted ? 'none' : 'block';
  }

  // Fullscreen button next to the mute button. Standard requestFullscreen everywhere
  // except iPhone Safari, which only exposes webkitEnterFullscreen (opens the native
  // player, with its own controls and sound). The video keeps looping either way.
  const fsBtn = document.getElementById('fullscreen-toggle');
  if (reelVideo && fsBtn) {
    fsBtn.addEventListener('click', () => {
      if (reelVideo.requestFullscreen) reelVideo.requestFullscreen();
      else if (reelVideo.webkitEnterFullscreen) reelVideo.webkitEnterFullscreen();
    });
    // Back from fullscreen: the hero loop must always be playing, even if the viewer
    // paused it in there. Two exit events for the two fullscreen mechanisms:
    // fullscreenchange (standard) and webkitendfullscreen (iPhone native player).
    function onFullscreenExit() {
      syncSoundIcon();
      // Some browsers pause the video internally, once or more, during the fullscreen-exit
      // transition (this varies by browser and isn't limited to iOS Safari). Keep resuming
      // for a short window using both a 'pause' listener and a poll — relying on the event
      // alone isn't reliable across engines. tryPlay() swallows the benign "play() request
      // was interrupted by pause()" rejection some browsers throw when play/pause race.
      function tryPlay() {
        const p = reelVideo.play();
        if (p && p.catch) p.catch(() => {});
      }
      const guardUntil = Date.now() + 1500;
      function cleanup() {
        reelVideo.removeEventListener('pause', resumeGuard);
        clearInterval(pollId);
      }
      function resumeGuard() {
        if (Date.now() < guardUntil) tryPlay();
        else cleanup();
      }
      const pollId = setInterval(() => {
        if (Date.now() >= guardUntil) { cleanup(); return; }
        if (reelVideo.paused) tryPlay();
      }, 150);
      reelVideo.addEventListener('pause', resumeGuard);
      tryPlay();
      setTimeout(cleanup, 1500);
    }
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) onFullscreenExit();
    });
    reelVideo.addEventListener('webkitendfullscreen', onFullscreenExit);
  }

  // Work grid: fetched once from data/projects.json and cached, then rendered into
  // #work-grid. Re-render (renderWorkGrid) is called again on language toggle above,
  // which is why the fetched list is cached in a variable instead of only used once.
  // activeFilter holds a project type code (e.g. 'TV') to show only that category, or
  // null to show everything — set by clicking a button in the category filter bar.
  let cachedProjects = null;
  let activeFilter = null;
  function renderWorkGrid() {
    const grid = document.getElementById('work-grid');
    if (!grid || !cachedProjects) return;
    const isFr = body.classList.contains('lang-fr');
    const visible = activeFilter ? cachedProjects.filter((p) => p.type === activeFilter) : cachedProjects;
    grid.innerHTML = visible.map((p) => `
      <a class="work-card" href="project.html?project=${encodeURIComponent(p.id)}">
        <img class="thumb" src="assets/${p.thumbnail}" alt="${p.title}" loading="lazy" style="object-position:${p.thumbnailFocus || '50% 50%'};">
        <div class="work-card-meta">
          <p class="type">${projectTypeAcronym(p.type, isFr)}</p>
          ${p.artist || p.client ? `<p class="artist">${p.artist || p.client}</p>` : ''}
          <p class="title">${p.title}</p>
        </div>
      </a>
    `).join('');
  }

  // Resize handling is rAF-throttled to match the scroll listener's pattern above —
  // without this, sizeReel ran once per resize event with no limit, unlike the scroll
  // handler which is deliberately throttled. Aug 2026.
  let resizeTicking = false;
  function onResizeThrottled() {
    sizeReel();
    resizeTicking = false;
  }
  window.addEventListener('resize', () => {
    if (!resizeTicking) {
      requestAnimationFrame(onResizeThrottled);
      resizeTicking = true;
    }
  });

  // Category filter bar: one button per entry in PROJECT_TYPES (from i18n.js), plus an
  // "All"/"Tous" button to clear the filter. Rebuilt on language toggle since the labels
  // are bilingual; clicking a button just sets activeFilter and re-renders the grid —
  // it doesn't refetch anything, filtering happens against the already-cached project list.
  function renderCategoryFilter() {
    const container = document.getElementById('category-filter');
    if (!container) return;
    const isFr = body.classList.contains('lang-fr');
    const allLabel = STRINGS['work.filter_all'] ? (isFr ? STRINGS['work.filter_all'].fr : STRINGS['work.filter_all'].en) : 'All';
    const items = [{ code: null, label: allLabel }].concat(
      Object.keys(PROJECT_TYPES).map((code) => ({ code, label: projectTypeLabel(code, isFr) }))
    );
    container.innerHTML = items.map((item) => `
      <button type="button" class="${activeFilter === item.code ? 'active' : ''}" data-filter="${item.code || ''}">${item.label}</button>
    `).join('');
    container.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.filter || null;
        renderCategoryFilter();
        renderWorkGrid();
      });
    });
  }

  // i18n (all static bilingual copy + project type acronyms) and the project list are
  // independent fetches, loaded in parallel — applyStrings() needs the former, and
  // renderWorkGrid() needs both (project data plus the type acronyms i18n provides).
  Promise.all([
    loadI18n(),
    fetch('data/projects.json').then((r) => r.json())
  ])
    .then(([, data]) => {
      applyStrings();
      cachedProjects = data.projects;
      renderCategoryFilter();
      renderWorkGrid();
    })
    .catch((err) => console.error('Impossible de charger les données:', err));

  // Contact section: photo, bio, email, location, availability, Instagram — editable in
  // the admin ("Coordonnées" panel) without touching this file, since they're pulled from
  // data/settings.json rather than hardcoded here.
  fetch('data/settings.json')
    .then((r) => r.json())
    .then((s) => {
      if (s.photoFilename) {
        document.getElementById('contact-photo').src = 'assets/' + s.photoFilename;
      }
      document.getElementById('contact-bio-fr').textContent = s.bioFr || '';
      document.getElementById('contact-bio-en').textContent = s.bioEn || '';
      const emailEl = document.getElementById('contact-email');
      emailEl.textContent = s.email;
      emailEl.href = 'mailto:' + s.email;
      document.getElementById('contact-location-fr').textContent = s.locationFr;
      document.getElementById('contact-location-en').textContent = s.locationEn;
      document.getElementById('contact-availability-fr').textContent = s.availabilityFr;
      document.getElementById('contact-availability-en').textContent = s.availabilityEn;
      const igEl = document.getElementById('contact-instagram');
      igEl.textContent = '@' + s.instagramHandle;
      igEl.href = 'https://instagram.com/' + s.instagramHandle;
    })
    .catch((err) => console.error('Impossible de charger les coordonnées:', err));

  // Halo/grain/background settings — editable in the admin (Design tab, sliders +
  // color picker). Independent fetch, applied on top of the CSS defaults in :root
  // (which already match this file's own defaults exactly), so a missing or
  // not-yet-created data/design.json just silently keeps the CSS defaults — never
  // breaks the page. Aug 2026.
  fetch('data/design.json')
    .then((r) => r.json())
    .then((d) => {
      const root = document.documentElement.style;
      if (d.haloIntensity != null) root.setProperty('--halo-intensity', d.haloIntensity);
      if (d.haloSize != null) root.setProperty('--halo-size', d.haloSize);
      if (d.haloFalloff != null) root.setProperty('--halo-falloff', d.haloFalloff);
      if (d.grainLevel != null) root.setProperty('--grain-level', d.grainLevel);
      if (d.bg) root.setProperty('--bg', d.bg);
    })
    .catch(() => {}); // file may not exist yet (first use, before any admin save) — fine, CSS defaults already match
</script>
</body>
</html>
