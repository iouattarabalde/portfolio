<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <!-- Logo: the favicon tile (assets/favicon.svg) re-laid-out on a 3:2 canvas. Same
       bg (hex 0C0C0C) and accent (hex 8A9A5B) tokens, same traced Big Shoulders Display
       900 "OB" outlines, same mark-to-height proportion as the 64px tile (cap height is
       5/8 of the canvas height), so it reads as the same mark at banner size. The mark
       is centred by transform rather than by re-tracing, so edits to the favicon paths
       can be pasted straight in. Corner radius keeps the favicon's 10/64 ratio against
       the short side. As in the favicon, XML comments here must never contain a literal
       double hyphen - it breaks strict SVG parsing in some browsers. -->
  <rect width="300" height="200" rx="31" fill="#0C0C0C"/>
  <g transform="translate(150,100) scale(3.125) translate(-32,-32)" fill="#8A9A5B">
