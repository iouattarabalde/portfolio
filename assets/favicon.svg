<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: dark tile with the olive accent monogram, matching the site's own bg
       (hex 0C0C0C) and accent (hex 8A9A5B) tokens in style.css. "OB" is traced as real
       vector paths from the actual Space Grotesk Bold outlines (same weight as the
       wordmark), not live text — browser favicon renderers don't load page webfonts, so
       a font family reference here would silently fall back and lose the typeface.
       Note for future edits: XML comments cannot contain a literal double hyphen; an
       earlier version of this file had one (from writing CSS variable names like
       "hyphen-hyphen-accent") and it broke strict SVG parsing in some browsers, which is
       why this file wasn't rendering as a tab icon at all. Regenerated Aug 2026; see
       chat history for the extraction method (fontTools SVGPathPen against the
       open-source Space Grotesk Bold TTF). -->
