<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: dark tile with the olive accent monogram, matching the site's own bg
       (hex 0C0C0C) and accent (hex 8A9A5B) tokens in style.css. "OB" is traced as real
       vector paths from the actual Big Shoulders Display outlines at weight 900 (the
       wordmark's weight), not live text. Browser favicon renderers don't load page
       webfonts, so a font family reference here would silently fall back and lose the
       typeface.
       Redrawn Sept 2026 when the site moved from Space Grotesk to Big Shoulders Display.
       Big Shoulders is condensed, so the cap height went from half the tile (32) to 40:
       at half height the mark only filled about half the tile's width and turned to mush
       at 16px. The mark is centred on the tile by its ink bounds. Extraction: fontTools
       varLib.instancer (wght 900) on fonts/big-shoulders-display-latin.woff2, then
       SVGPathPen, one path per glyph at its advance.
       Note for future edits: XML comments cannot contain a literal double hyphen; an
       earlier version of this file had one (from writing CSS variable names like
       "hyphen-hyphen-accent") and it broke strict SVG parsing in some browsers, which is
       why this file wasn't rendering as a tab icon at all. -->
  <rect width="64" height="64" rx="10" fill="#0C0C0C"/>
  <g fill="#8A9A5B">
    <path transform="translate(7.688,52.000) scale(0.02500,-0.02500)" d="M496 -20Q276 -20 177.5 73Q79 166 74 382Q72 480 71 586Q70 692 70 801Q70 910 71 1016Q72 1122 74 1220Q79 1435 177.5 1527.5Q276 1620 496 1620Q717 1620 813 1527.5Q909 1435 916 1220Q920 1120 922 1014Q924 908 924 799.5Q924 691 922 585.5Q920 480 916 382Q909 166 813 73Q717 -20 496 -20ZM496 224Q555 224 585 250.5Q615 277 616 326Q621 428 623 550Q625 672 625 801Q625 930 623 1052Q621 1174 616 1276Q615 1324 584 1350Q553 1376 496 1376Q439 1376 407.5 1350Q376 1324 374 1276Q370 1174 367.5 1052Q365 930 365 801Q365 672 367.5 550Q370 428 374 326Q376 277 407.5 250.5Q439 224 496 224Z"/>
